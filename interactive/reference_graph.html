  if(best!==hot){hot=best;draw();}
  if(best){tip.style.opacity=1;tip.style.left=(mx+14)+'px';tip.style.top=(my+14)+'px';
    tip.innerHTML=`<b>${best.label}</b><span class="m">${best.band.nm} · ${best.chap? best.chap+"장":"전반·부록"}${best.pole&&POLE[best.pole]?" · "+best.pole+POLE[best.pole].n:""}${best.emo?" · "+best.emo:""}${best.friction?'<br>마찰 '+best.friction:''}</span>`;
  } else tip.style.opacity=0;
});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;
  view.k=Math.max(.45,Math.min(5,view.k*f));draw();},{passive:false});
cv.addEventListener('click',()=>{ if(!hot) return; sel=hot;
  const ins=DATA.edges.filter(e=>e.s===sel.id||e.t===sel.id).map(e=>e.s===sel.id?e.t:e.s);
  const g=(k)=>ins.filter(id=>byId[id]&&byId[id].layer===k);
  document.getElementById('card').innerHTML=
    `<h3>${sel.label}</h3><div class="m">${sel.band.nm} · ${sel.chap?sel.chap+'장':'전반·부록'} · 잇는 선 ${ins.length}</div>`
    +(sel.friction?`<p style="margin:9px 0 0">마찰 — ${sel.friction}</p>`:'')
    + BAND.map(b=>{const a=g(b.k); return a.length?`<div class="m" style="margin-top:9px">${b.nm} ${a.length}</div><ul>${a.slice(0,9).map(x=>`<li>${byId[x].label.slice(0,30)}</li>`).join('')}</ul>`:''}).join('');
});
document.getElementById('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw()});
document.getElementById('rows').innerHTML=BAND.map(b=>
 `<button class="rw" data-k="${b.k}" aria-pressed="true"><span class="dot" style="background:var(${b.c});color:var(${b.c})"></span>${b.nm}<span class="n" id="n_${b.k}"></span></button>`).join('');
document.getElementById('rows').addEventListener('click',e=>{const b=e.target.closest('.rw');if(!b)return;
  on[b.dataset.k]=!on[b.dataset.k];b.setAttribute('aria-pressed',on[b.dataset.k]);draw();});
document.getElementById('poles').innerHTML=Object.entries(POLE).map(([e,v])=>
 `<div class="rw" style="cursor:default"><span class="dot" style="background:transparent;border:2.5px solid ${v.c};box-shadow:none"></span>${e} ${v.n}<span class="n">${DATA.nodes.filter(n=>n.pole===e).length}</span></div>`).join('');
document.getElementById('reset').onclick=()=>{view={x:0,y:0,k:1};draw()};
addEventListener('resize',resize);
resize(); requestAnimationFrame(resize); setTimeout(resize,120);
BAND.forEach(b=>{const el=document.getElementById('n_'+b.k); if(el) el.textContent=N.filter(n=>n.layer===b.k).length;});
document.getElementById('card').innerHTML='<h3>노드를 누른다</h3><div class="m">세로 = Marr 층 · 가로 = 장. 선은 대부분 층을 가로지른다 — 경험이 생각을 물고, 생각과 상징이 장에 붙는다.</div>';
</script></body></html>
