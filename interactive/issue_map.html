  ctx.fillStyle="#FFD53A"; ctx.beginPath(); ctx.arc(cx,cy,4.6,0,7); ctx.fill();
  ctx.font='600 11px "IBM Plex Mono",monospace'; ctx.fillStyle="#FFD53A";
  ctx.textAlign='center'; ctx.fillText("저장소", cx, cy-11);
  const L=[[-1,"다(多) · 빚을 쓴다","열린 "+DATA.nodes.filter(n=>n.s!=="CLOSED").length,"#2F6BE0"],
           [ 1,"세(世) · 빚을 갚는다","닫힌 "+DATA.nodes.filter(n=>n.s==="CLOSED").length,"#E23B3B"]];
  L.forEach(([sgn,t1,t2,col])=>{
    const R2=Math.min(W*.40,H*.78)*view.k;
    const x=cx+sgn*R2*0.70, y=cy+R2*0.34;
    ctx.textAlign=sgn<0?'right':'left'; ctx.fillStyle=col;
    ctx.font='600 13px "Noto Serif KR",serif'; ctx.fillText(t1,x,y-4);
    ctx.font='400 11px "IBM Plex Mono",monospace'; ctx.fillStyle=CSS('--ink3');
    ctx.fillText(t2,x,y+14);
  });
  ctx.textAlign='left';
}
const vis=n=>on[n.k] && (opt.closed||n.s!=="CLOSED") && (opt.iso||n.d>0)
           && (!q || String(n.n).includes(q) || n.t.toLowerCase().includes(q.toLowerCase()));
const T=n=>({x:(n.x+view.x)*view.k, y:(n.y+view.y)*view.k});
const rad=n=>Math.min(13, 3.4+Math.sqrt(n.d)*1.9);

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.fillStyle=CSS('--bg'); ctx.fillRect(0,0,W,H);
  if(LAY==="fly"){ drawLemniscate(); } else {
  COLS.forEach((c,i)=>{                                   // 세로축 = 장(주제)
    const y=(146+i*((H-250)/(COLS.length-1))+view.y)*view.k;
    ctx.strokeStyle="rgba(255,255,255,.05)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,y-14); ctx.lineTo(W,y-14); ctx.stroke();
    ctx.font='600 11.5px "IBM Plex Mono",monospace'; ctx.fillStyle=CC[c];
    ctx.textAlign='right'; ctx.globalAlpha=.9;
    ctx.fillText(CN[c], 286, y-16); ctx.globalAlpha=1;
  });
  KIND.forEach(([k,nm],i)=>{                              // 가로축 = 자리(분야)
    const x=(300+i*((W-490)/(KIND.length-1))+view.x)*view.k;
    ctx.font='500 11px "IBM Plex Mono",monospace'; ctx.fillStyle=CSS('--ink3');
    ctx.textAlign='center'; ctx.fillText(nm, x, 96);
  });
  }
  E.forEach(e=>{
    if(!vis(e.a)&&!vis(e.b)) return;
    const near=hot&&(e.a.n===hot.n||e.b.n===hot.n);
    const p=T(e.a), r=T(e.b);
    const cross = LAY==="fly" && e.a._side && e.a._side!==e.b._side;
    ctx.strokeStyle= near?"rgba(217,162,39,.8)"
                   : cross?"rgba(217,162,39,.22)":"rgba(140,152,182,.10)";
    ctx.lineWidth= near?1.7:Math.min(1.5,.5+e.w*.12);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    ctx.bezierCurveTo(p.x,(p.y+r.y)/2, r.x,(p.y+r.y)/2, r.x,r.y); ctx.stroke();
  });
  N.forEach(n=>{
    if(!vis(n)) return; const p=T(n), r=rad(n)*Math.min(1.5,view.k);
    const col = LAY==="fly" ? (n.s==="CLOSED"?"#E23B3B":"#2F6BE0") : CC[n.c];
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
    if(LAY!=="fly" && n.s==="CLOSED"){ ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.globalAlpha=.72; ctx.stroke(); }
    else { ctx.fillStyle=col; ctx.globalAlpha=(hot&&hot.n===n.n)?1:(LAY==="fly"?.66:.82); ctx.fill(); }
    ctx.globalAlpha=1;
    if(sel&&sel.n===n.n){ ctx.strokeStyle="#EDE7DA"; ctx.lineWidth=1.6; ctx.beginPath();
      ctx.arc(p.x,p.y,r+4,0,7); ctx.stroke(); }
    if(n.d>=14||view.k>1.8){ ctx.font='500 10px "IBM Plex Mono",monospace';
      ctx.fillStyle=CSS('--ink2'); ctx.textAlign='center'; ctx.fillText("#"+n.n,p.x,p.y-r-5); }
  });
}
function resize(){ const b=cv.getBoundingClientRect(); DPR=devicePixelRatio||1;
  W=b.width; H=b.height; cv.width=W*DPR; cv.height=H*DPR; layout(); draw(); }
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};cv.classList.add('drag')});
addEventListener('mouseup',()=>{drag=null;cv.classList.remove('drag')});
cv.addEventListener('mousemove',e=>{
  if(drag){ view.x=drag.vx+(e.clientX-drag.x)/view.k; view.y=drag.vy+(e.clientY-drag.y)/view.k; draw(); return; }
  const b=cv.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
  let best=null,bd=1e9;
  N.forEach(n=>{ if(!vis(n))return; const p=T(n); const d=Math.hypot(p.x-mx,p.y-my);
    if(d<Math.max(11,rad(n)+6)&&d<bd){bd=d;best=n;} });
  if(best!==hot){hot=best;draw();}
  if(hot){ tip.style.opacity=1; tip.style.left=Math.min(mx+16,W-330)+'px'; tip.style.top=(my+16)+'px';
    tip.innerHTML=`<b>#${hot.n}</b> ${hot.t}<br><span style="color:#5C6478;font-family:monospace;font-size:10.5px">`
      +`${CN[hot.c]} · 선 ${hot.d} <b>(out ${hot.o} · in ${hot.i})</b> · 댓글 ${hot.cm} · ${hot.s==="CLOSED"?"닫힘":"열림"}</span>`;
  } else tip.style.opacity=0;
});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;
  view.k=Math.max(.5,Math.min(6,view.k*f));draw();},{passive:false});
cv.addEventListener('click',()=>{ if(!hot) return; sel=hot;
  const ins=DATA.edges.filter(e=>e.a===sel.n||e.b===sel.n)
            .map(e=>({n:(e.a===sel.n?e.b:e.a),w:e.w})).sort((x,y)=>y.w-x.w);
  const outs=DATA.dir.filter(e=>e[0]===sel.n).map(e=>({n:e[1],w:e[2]})).sort((x,y)=>y.w-x.w);
  const incs=DATA.dir.filter(e=>e[1]===sel.n).map(e=>({n:e[0],w:e[2]})).sort((x,y)=>y.w-x.w);
  const li=o=>`<li><a href="${BASE+o.n}" target="_blank" rel="noopener"
       style="color:#99A0B2">#${o.n}</a> ${(by[o.n]?by[o.n].t:"").slice(0,26)}${o.w>1?` <span class="m">×${o.w}</span>`:""}</li>`;
  document.getElementById('card').innerHTML=
    `<h3>#${sel.n} ${sel.t}</h3><div class="m">${CN[sel.c]} · ${sel.s==="CLOSED"?"닫힘":"열림"}`
    +` · 댓글 ${sel.cm}${sel.m?" · "+sel.m:""}</div>`
    +`<a class="go" href="${BASE+sel.n}" target="_blank" rel="noopener">↗ GitHub에서 열기</a>`
    +(sel.l.length?`<div class="m" style="margin-top:8px">라벨</div><div>${sel.l.join(" · ")}</div>`:"")
    +(outs.length?`<div class="m" style="margin-top:9px">🪽 부른 곳 — 원심력 out ${sel.o}</div><ul>`
      +outs.slice(0,12).map(li).join("")+`</ul>`
      :`<div class="m" style="margin-top:9px">🪽 아무것도 부르지 않았다 — <b>원심력 0</b></div>`)
    +(incs.length?`<div class="m" style="margin-top:9px">🧲 불린 곳 — 구심력 in ${sel.i}</div><ul>`
      +incs.slice(0,12).map(li).join("")+`</ul>`
      :`<div class="m" style="margin-top:9px">🧲 아무도 부르지 않았다 — 구심력 0</div>`)
    +(ins.length?``:`<div class="m" style="margin-top:9px">양쪽이 비었다 — 고립</div>`);
  draw();
});
cv.addEventListener('dblclick',e=>{e.preventDefault(); if(hot) window.open(BASE+hot.n,'_blank','noopener');});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();draw()});
document.getElementById('kinds').innerHTML=KIND.map(([k,nm])=>
 `<button class="rw" data-k="${k}" aria-pressed="true"><span class="dot" style="background:#4A5266"></span>${nm}<span class="n" id="k_${k}"></span></button>`).join('');
document.getElementById('kinds').addEventListener('click',e=>{const b=e.target.closest('.rw');if(!b)return;
  on[b.dataset.k]=!on[b.dataset.k];b.setAttribute('aria-pressed',on[b.dataset.k]);draw();});
document.getElementById('opts').innerHTML=
 `<button class="rw" data-o="closed" aria-pressed="true">닫힌 이슈 보기</button>`+
 `<button class="rw" data-o="iso" aria-pressed="true">고립 이슈 보기</button>`;
document.getElementById('opts').addEventListener('click',e=>{const b=e.target.closest('.rw');if(!b)return;
  opt[b.dataset.o]=!opt[b.dataset.o];b.setAttribute('aria-pressed',opt[b.dataset.o]);draw();});
document.getElementById('reset').onclick=()=>{view={x:0,y:0,k:1};draw()};
document.getElementById('lay').onclick=function(){
  LAY = LAY==="fly" ? "grid" : "fly";
  this.setAttribute('aria-pressed', LAY==="fly");
  this.lastChild.textContent = LAY==="fly" ? "나비 ⇄ 격자" : "격자 ⇄ 나비";
  view={x:0,y:0,k:1}; layout(); draw();
};
addEventListener('resize',resize); resize(); setTimeout(resize,120);
KIND.forEach(([k])=>{const el=document.getElementById('k_'+k);
  if(el) el.textContent=DATA.nodes.filter(n=>n.k===k).length;});
</script></body></html>
