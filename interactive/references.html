const CHAP_NAME = {"1": "1장 · 거울 새장", "2": "2장 · 망원경 새장", "3": "3장 · 스테인드글라스 새장", "4": "4장 · 시계 새장", "5": "5장 · 거울 둥지", "6": "6장 · 나비 둥지", "7": "7장 · 튤립 둥지", "8": "8장 · 안개 둥지", "9": "9장 · 까마귀 둥지", "10": "10장 · 101호 (에필로그)", "14": "부록4 · 연료·둥지", "15": "부록5 · 언어철학"};
const CHAP_SLUG = {"1": "ch1_mirror_cage", "2": "ch2_telescope_cage", "3": "ch3_glass_cage", "4": "ch4_clock_cage", "5": "ch5_mirror_nest", "6": "ch6_play_nest", "7": "ch7_tulip_nest", "8": "ch8_mist_nest", "9": "ch9_raven_nest", "10": "ch10_epilogue"};
let view = "chapter", sortKey="ch", sortDir=1, q="";

const catColor = {"1차자료":"#e89ab3","학자anchor":"#9ab3d9","언어학anchor":"#bcd089","현장사례":"#f0a96b"};
function chipFor(r){ return '<span class="chip c'+r.ch+'">'+ (r.chapter_label||'') +'</span>'; }
function workLink(r){
  const slug = CHAP_SLUG[r.ch];
  const title = (r.work? r.work : r.author_ko);
  const t = '<span class="t">'+esc(r.author_ko)+'</span> <span class="work">'+esc(r.work)+'</span>';
  if(slug) return '<a class="chap-link" href="reader.html?file='+slug+'">'+t+'</a>';
  return t;
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function statusCell(s){ return s==='확정'? '<span class="st-ok">● 확정</span>' : '<span class="st-warn">○ '+esc(s)+'</span>'; }

function filtered(){
  let d = DATA.slice();
  if(view==="check") d = d.filter(r=>r.status!=="확정");
  if(q){ const k=q.toLowerCase();
    d = d.filter(r=>(r.author_ko+r.author+r.work).toLowerCase().includes(k)); }
  return d;
}
function sortRows(d){
  d.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(typeof x==='string'){x=x.toLowerCase();y=(y||'').toLowerCase();}
    if(x<y)return -1*sortDir; if(x>y)return 1*sortDir;
    return (a.author_ko<b.author_ko?-1:1);
  });
  return d;
}
const COLS=[["chapter_label","인용 장"],["author_ko","저자"],["work","원작"],["year","연도"],["appendix","부록"],["category","분류"],["status","상태"]];

function renderTable(group){
  let d = sortRows(filtered());
  let h='<table><thead><tr>';
  for(const [k,lab] of COLS){
    const arr = sortKey===k? (sortDir>0?' ▲':' ▼'):'';
    h+='<th data-k="'+k+'">'+lab+'<span class="arr">'+arr+'</span></th>';
  }
  h+='</tr></thead><tbody>';
  if(group){
    // group by current sortKey-independent grouping field
    const gf = group;
    const seen=[]; const groups={};
    d.forEach(r=>{ const g = gf(r); if(!(g in groups)){groups[g]=[];seen.push(g);} groups[g].push(r); });
    // group order
    let order = seen;
    if(view==="chapter") order = seen.sort((a,b)=>(+a)-(+b));
    else order = seen.sort();
    for(const g of order){
      const label = view==="chapter" ? (CHAP_NAME[g]||(g+'장')) : g;
      h+='<tr class="grouphdr"><td colspan="'+COLS.length+'">'+esc(label)+' <span style="color:var(--dim);font-weight:400;font-size:11px;">('+groups[g].length+')</span></td></tr>';
      for(const r of groups[g]) h+=rowHtml(r);
    }
  } else {
    for(const r of d) h+=rowHtml(r);
  }
  h+='</tbody></table>';
  return h;
}
function rowHtml(r){
  return '<tr>'
    +'<td>'+chipFor(r)+'</td>'
    +'<td>'+workLink(r)+'</td>'
    +'<td class="work">'+esc(r.work)+'</td>'
    +'<td>'+(r.year||'')+'</td>'
    +'<td class="appx">'+esc(r.appendix)+'</td>'
    +'<td><span class="chip" style="background:'+(catColor[r.category]||'#444')+'22;color:'+(catColor[r.category]||'#aaa')+'">'+esc(r.category)+'</span></td>'
    +'<td>'+statusCell(r.status)+'</td>'
    +'</tr>';
}
function renderCards(){
  let d = sortRows(filtered());
  let h='<div class="cards">';
  for(const r of d){
    const slug=CHAP_SLUG[r.ch];
    const href = slug? 'reader.html?file='+slug : '#';
    h+='<a class="pcard" href="'+href+'">'
      +'<img loading="lazy" src="'+esc(r.cover)+'" alt="">'
      +'<div class="meta"><div class="t">'+esc(r.author_ko)+'</div>'
      +'<div class="a">'+esc(r.work)+'</div>'
      +'<div class="a">'+chipFor(r)+'</div></div></a>';
  }
  h+='</div>'; return h;
}
function render(){
  const out=document.getElementById('out');
  let body;
  if(view==="cover"){ body=renderCards(); }
  else if(view==="chapter"){ body=renderTable(r=>r.ch); }
  else if(view==="author"){ body=renderTable(r=>r.author_ko); }
  else if(view==="category"){ body=renderTable(r=>r.category); }
  else { body=renderTable(null); } // check
  out.innerHTML=body;
  document.getElementById('count').textContent = filtered().length+'개 표시';
  out.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;}
    render();
  });
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); view=t.dataset.view;
  sortKey = view==="chapter"?"ch":"author_ko"; sortDir=1;
  render();
});
document.getElementById('q').oninput=e=>{q=e.target.value;render();};
document.getElementById('total').textContent = DATA.length+'개 자료';
render();
</script>
</body>
