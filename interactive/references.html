<style>

  :root{
    --bg:#0e1320; --card:#1a2238; --card-2:#232c47; --border:rgba(255,255,255,0.08);
    --text:#f0f2f5; --text-2:#b8c2d4; --dim:#7c8aa8; --gold:#c5a55a; --gold-soft:rgba(197,165,90,0.18);
    --done:#4ade80; --warn:#fbbf24;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);
    font-size:14px;line-height:1.7;padding:32px 24px 80px;max-width:1180px;margin:0 auto;-webkit-font-smoothing:antialiased;}
  .hero{text-align:center;padding:40px 20px 28px;margin-bottom:24px;border-bottom:1px solid var(--border);}
  .hero h1{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:700;color:var(--gold);letter-spacing:-1px;margin-bottom:10px;}
  .hero .sub{font-size:13px;color:var(--dim);}
  .hero .back{display:inline-block;margin-top:14px;color:var(--text-2);text-decoration:none;font-size:12px;border-bottom:1px solid var(--border);}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text-2);
    cursor:pointer;font-size:13px;transition:all .18s;}
  .tab:hover{background:var(--card-2);}
  .tab.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:500;}
  .search{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:8px 12px;color:var(--text);font-size:13px;min-width:200px;font-family:inherit;}
  .search::placeholder{color:var(--dim);}
  .count{font-size:12px;color:var(--dim);margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;padding:9px 10px;color:var(--dim);font-weight:500;font-size:12px;
    border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--bg);}
  thead th:hover{color:var(--text-2);}
  thead th .arr{opacity:.5;font-size:10px;}
  tbody td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:top;}
  tbody tr:hover{background:rgba(255,255,255,0.025);}
  .grouphdr td{background:var(--card);color:var(--gold);font-weight:600;font-size:13px;padding:11px 10px;
    font-family:'Noto Serif KR',serif;border-bottom:1px solid var(--border);}
  .chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap;}
  .chap-link{color:var(--text);text-decoration:none;border-bottom:1px solid rgba(197,165,90,0.3);}
  .chap-link:hover{color:var(--gold);}
  .work{color:var(--dim);font-size:12px;font-style:italic;}
  .st-ok{color:var(--done);white-space:nowrap;} .st-warn{color:var(--warn);white-space:nowrap;}
  /* 전집 칸이 늘면서 상태가 두 줄로 접혔다 — 칸을 세로로 안 쪼갠다 */
  tbody td:last-child{white-space:nowrap;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
  .pcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--text);transition:all .18s;}
  .pcard:hover{transform:translateY(-2px);border-color:var(--gold-soft);}
  .pcard img{width:100%;height:200px;object-fit:cover;display:block;background:var(--card-2);}
  .pcard .meta{padding:9px 11px;}
  .pcard .t{font-size:12px;font-weight:500;line-height:1.4;}
  .pcard .a{font-size:11px;color:var(--dim);margin-top:3px;}
  .hidden{display:none;}
  /* 빌린 문장 층 */
  .sect{margin:0 0 26px;}
  .sect h2{font-family:'Noto Serif KR',serif;font-size:17px;color:var(--gold);font-weight:600;
    margin-bottom:4px;}
  .sect .lead{font-size:12.5px;color:var(--text-2);margin-bottom:12px;max-width:760px;}
  .q{font-family:'Noto Serif KR',serif;color:var(--text);}
  .src{color:var(--text-2);font-size:12.5px;}
  .flag{color:var(--warn);font-size:12px;}
  .note{background:var(--card);border:1px solid var(--border);border-left:2px solid var(--gold);
    border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--text-2);margin:14px 0 0;}
  .note b{color:var(--text);}
  .note ul{margin:6px 0 0 16px;} .note li{margin:3px 0;}
  .kind{font-family:'DM Mono',monospace;font-size:11px;}
  /* 위 `td:last-child{nowrap}` 는 받치는 자료 표의 「상태」 칸을 위한 것이다.
     여기 표들은 마지막 칸이 긴 글이라 그대로 두면 칸이 부풀어 「장」이 세로로 접힌다. */
  .sect td:last-child{white-space:normal;}
  .sect td:first-child{white-space:nowrap;}
  .sect td:nth-child(2){white-space:nowrap;}
  /* 장 색상 */
  .c1{background:rgba(200,104,138,.18);color:#e89ab3;} .c2{background:rgba(196,176,106,.18);color:#d9c884;}

function chipFor(r){ return '<span class="chip c'+r.ch+'">'+ (r.chapter_label||'') +'</span>'; }

function noCell(r){
  if(!r.no) return '<span style="color:var(--dim)">·</span>';

function workLink(r){
  const slug = CHAP_SLUG[r.ch];

  const t = '<span class="t">'+esc(r.author_ko)+'</span> <span class="work">'+esc(r.work)+'</span>';

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function statusCell(s){ return s==='확정'? '<span class="st-ok">● 확정</span>' : '<span class="st-warn">○ '+esc(s)+'</span>'; }

function filtered(){
  let d = DATA.slice();
  if(view==="check") d = d.filter(r=>r.status!=="확정");
  if(q){ const k=q.toLowerCase();
    d = d.filter(r=>(r.author_ko+r.author+r.work).toLowerCase().includes(k)); }
  return d;
}
function sortRows(d){
  d.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(typeof x==='string'){x=x.toLowerCase();y=(y||'').toLowerCase();}
    if(x<y)return -1*sortDir; if(x>y)return 1*sortDir;
    return (a.author_ko<b.author_ko?-1:1);
  });
  return d;
}
// 「부록」 칸은 내렸다 — 가리키던 부록4·부록5 가 지면에 없다(룰링 11-18·11-19).
const COLS=[["chapter_label","인용 장"],["no","세계문학전집"],["author_ko","저자"],["work","원작"],["year","연도"],["category","분류"],["status","상태"]];

function renderTable(group){
  let d = sortRows(filtered());
  let h='<table><thead><tr>';
  for(const [k,lab] of COLS){
    const arr = sortKey===k? (sortDir>0?' ▲':' ▼'):'';
    h+='<th data-k="'+k+'">'+lab+'<span class="arr">'+arr+'</span></th>';
  }
  h+='</tr></thead><tbody>';
  if(group){
    // group by current sortKey-independent grouping field
    const gf = group;
    const seen=[]; const groups={};
    d.forEach(r=>{ const g = gf(r); if(!(g in groups)){groups[g]=[];seen.push(g);} groups[g].push(r); });
    // group order
    let order = seen;
    if(view==="chapter") order = seen.sort((a,b)=>(+a)-(+b));
    if(view==="chapter") for(const g of order) groups[g].sort((a,b)=>(b.no?1:0)-(a.no?1:0));
    else order = seen.sort();
    for(const g of order){
      const label = view==="chapter" ? (CHAP_NAME[g]||(g+'장')) : g;
      h+='<tr class="grouphdr"><td colspan="'+COLS.length+'">'+esc(label)+' <span style="color:var(--dim);font-weight:400;font-size:11px;">('+groups[g].length+')</span></td></tr>';
      for(const r of groups[g]) h+=rowHtml(r);
    }
  } else {
    for(const r of d) h+=rowHtml(r);
  }
  h+='</tbody></table>';
  return h;
}
function rowHtml(r){
  return '<tr'+(r.no?' style="background:rgba(197,165,90,.045)"':'')+'>'
    +'<td>'+chipFor(r)+'</td>'
    +'<td>'+noCell(r)+'</td>'
    +'<td>'+workLink(r)+'</td>'
    +'<td class="work">'+esc(r.work)+'</td>'
    +'<td>'+(r.year||'')+'</td>'
    +'<td><span class="chip" style="background:'+(catColor[r.category]||'#444')+'22;color:'+(catColor[r.category]||'#aaa')+'">'+esc(r.category)+'</span></td>'
    +'<td>'+statusCell(r.status)+'</td>'
    +'</tr>';
}
// ① 빌린 문장 — 부록8 인용서지가 정본. 쪽은 적지 않는다(판본마다 다르다).
function renderBorrowed(){
  const k=q.toLowerCase();
  const bk = k? BOOKS.filter(b=>(b.work+b.author+b.translator+b.edition).toLowerCase().includes(k)) : BOOKS;
  const ln = k? LINES.filter(l=>(l.quote+l.where+l.ch).toLowerCase().includes(k)) : LINES;
  let h='';
  h+='<div class="sect"><h2>데려온 책 '+BOOKS.length+'</h2>'
    +'<div class="lead">쪽은 적지 않는다 — 판본마다 쪽이 다르고, 쪽을 적으면 그 판본을 가진 사람만 찾을 수 있다. '
    +'대신 장면과 부·장을 적는다.</div>'
    +'<table><thead><tr><th>작품</th><th>지은이</th><th>옮긴이</th><th>판본</th></tr></thead><tbody>';
  for(const b of bk){
    h+='<tr><td class="q">'+esc(b.work)+'</td><td>'+esc(b.author)+'</td>'
      +'<td'+(b.unknown?' class="flag"':'')+'>'+esc(b.translator)+'</td>'
      +'<td class="src">'+esc(b.edition)+'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div class="sect"><h2>데려온 문장 '+LINES.length+'</h2>'
    +'<div class="lead">어느 문장이 내 것이고 어느 문장이 빌린 것인지는, 빌린 쪽이 밝혀야 한다.</div>'
    +'<table><thead><tr><th>#</th><th>본문</th><th>문장</th><th>어디서</th></tr></thead><tbody>';
  for(const l of ln){
    const slug=CHAP_SLUG[parseInt(l.ch,10)];
    const chc = slug? '<a class="chap-link" href="reader.html?file='+slug+'">'+esc(l.ch)+'</a>' : esc(l.ch);
    h+='<tr><td class="kind">'+esc(l.n)+'</td><td>'+chc+'</td>'
      +'<td class="q">'+esc(l.quote)+'</td><td class="src">'+esc(l.where)+'</td></tr>';
  }
  h+='</tbody></table>';
  if(NOTQ.length){
    h+='<div class="note"><b>데려오지 않은 것 '+NOTQ.length+'</b> — 큰따옴표 안에 있으나 옮겨 적은 문장이 아니다. '
      +'작중 인물이 제 입으로 줄여 말한 것이라 출처가 아니라 화자가 진다.<ul>';
    for(const x of NOTQ) h+='<li>'+esc(x)+'</li>';
    h+='</ul></div>';
  }
  const un = BOOKS.filter(b=>b.unknown);
  if(un.length){
    h+='<div class="note"><b class="flag">아직 못 채운 칸 '+un.length+'</b> — 옮긴이를 모른다. '
      +'짐작으로 적지 않고 모른다고 적는다 — 옮긴 사람의 이름은 둘 중 하나로 찍을 것이 아니다.<ul>';
    for(const b of un) h+='<li>'+esc(b.work)+'</li>';
    h+='</ul></div>';
  }
  h+='</div>';
  return h;
}

  }
  h+='</tbody></table>';
  const miss=[]; for(let c=1;c<=10;c++) if(!seen.has(c)) miss.push(c+'장');
  if(miss.length) h+='<div class="note"><b>빈 자리 '+miss.join(' · ')+'</b> — 빠진 것이 아니다. '
    +'5장은 외부 출처가 0건이고(101₂호라 받을 것이 없다), 10장이 설 만한 자리는 이미 다른 장이 받았거나 '
    +'인용이 아니라 언급이다.</div>';
  h+='</div>';
  return h;
}

function renderCards(){
  let d = sortRows(filtered());
  let h='<div class="cards">';
  for(const r of d){
    const slug=CHAP_SLUG[r.ch];
    const href = slug? 'reader.html?file='+slug : '#';
    h+='<a class="pcard" href="'+href+'">'
      +'<img loading="lazy" src="'+esc(r.cover)+'" alt="">'
      +'<div class="meta"><div class="t">'+esc(r.author_ko)+'</div>'
      +'<div class="a">'+esc(r.work)+'</div>'
      +'<div class="a">'+chipFor(r)+'</div></div></a>';
  }
  h+='</div>'; return h;
}
function render(){
  const out=document.getElementById('out');
  let body;
  if(view==="borrow"){ body=renderBorrowed(); }
  else if(view==="other"){ body=renderOther(); }
  else if(view==="cover"){ body=renderCards(); }
  else if(view==="chapter"){ body=renderTable(r=>r.ch); }
  else if(view==="author"){ body=renderTable(r=>r.author_ko); }
  else if(view==="category"){ body=renderTable(r=>r.category); }
  else { body=renderTable(null); } // check
  out.innerHTML=body;
  document.getElementById('count').textContent =
    view==="borrow" ? (BOOKS.length+'권 · 문장 '+LINES.length)
    : view==="other" ? (OTHER.length+'건')
    : (filtered().length+'개 표시');
  out.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;}
    render();
  });
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); view=t.dataset.view;
  sortKey = (view==="chapter"||view==="borrow"||view==="other")?"ch":"author_ko"; sortDir=1;
  render();
});
document.getElementById('q').oninput=e=>{q=e.target.value;render();};
document.getElementById('total').textContent = DATA.length+'개';
// 장마다 몇 편이 서 있나 — 0 인 장도 적는다
(function(){
  const cnt={}; DATA.forEach(r=>cnt[r.ch]=(cnt[r.ch]||0)+1);
  const mx = Math.max(...Object.values(cnt));
  let h='';
  for(let c=1;c<=10;c++){
    const v=cnt[c]||0;
    const col = v===0? 'var(--dim)' : (v>=mx? 'var(--gold)':'var(--text-2)');
    h+='<span style="display:inline-block;min-width:52px;color:'+col+';font-family:\'DM Mono\',monospace;font-size:12px">'
      + c + '장 <b>' + v + '</b></span>';
  }
  const none=cnt[99]||0;
  h+='<span style="display:inline-block;color:var(--warn);font-family:\'DM Mono\',monospace;font-size:12px">장 없음 <b>'+none+'</b></span>';
  document.getElementById('spread').innerHTML=h;
})();
render();
</script>
</body>
