<div id="hd"><h1>심장 열하나 — 나가는 화살이 있나</h1>
<div id="claim">「그렇게 생각한다」와 「그렇게 생각하고 싶다」는 <b>말로는 안 갈린다.</b> 둘 다 똑같은 문장을 쓴다.
가르는 것은 그 뒤에 그 생각을 꺼내 쓴 글이 있느냐다 — <b>나가는 화살이 있으면 앞엣것, 없으면 뒤엣것.</b></div>
<div id="sub">심장 11건 전부. 왼쪽 <b>10</b> · 오른쪽 <b>1</b> — 207건 중 심장만 떼어 세웠다. 점을 누르면 토론이 열린다.</div></div>
