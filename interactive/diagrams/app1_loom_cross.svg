<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" role="img" aria-label="베틀 — 낭만 한 가닥이 세로로 세 날짜를 꿰고, 의심이 날짜마다 가로로 한 번씩 건넌다. 매듭 셋은 본문 6장·7장·10장으로 간다." font-family="Noto Sans KR, Apple SD Gothic Neo, Helvetica Neue, Arial, sans-serif">
<rect width="1060" height="640" fill="#FFFFFF"/>
<style> a.knot{cursor:pointer} a.knot .hit{fill:#14130F;fill-opacity:0;pointer-events:all} a.knot:hover .hit,a.knot:focus .hit{fill-opacity:0.05} a.knot:hover .chname,a.knot:focus .chname{text-decoration:underline} a.knot:focus{outline:none}</style>

<text x="56" y="52" font-size="20" font-weight="700" fill="#14130F">베틀 — 낭만은 세로, 의심은 가로</text>
<text x="56" y="78" font-size="12.5" fill="#5E584E">한 가닥이 세 날짜를 꿰고(<tspan fill="#C8442A" font-weight="700">세로</tspan>), 날짜마다 한 번씩 가로질러 눌린다(<tspan fill="#2F6F9F" font-weight="700">가로</tspan>). <tspan font-weight="700">눌린 자리에만 천이 생긴다.</tspan></text>

<text x="150" y="146" font-size="12.5" fill="#9A938A">새장 <tspan font-weight="700" fill="#5E584E">안</tspan> — 남이 나에게 건다</text>
<text x="1000" y="146" font-size="12.5" fill="#9A938A" text-anchor="end">새장 <tspan font-weight="700" fill="#5E584E">밖</tspan> — 내가 나에게 건다</text>
<line x1="150" y1="158" x2="1000" y2="158" stroke="#E6E1D8" stroke-width="1"/>

<line x1="565" y1="176" x2="565" y2="500" stroke="#C8442A" stroke-width="7" stroke-linecap="round"/>
<line x1="565" y1="500" x2="565" y2="592" stroke="#C8442A" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 13" opacity="0.55"/>
<text x="585" y="586" font-size="12.5" fill="#B08D7A">안 눌린 자리는 아직 실이다</text>

<line x1="150" y1="222" x2="1000" y2="222" stroke="#2F6F9F" stroke-width="5" stroke-linecap="round"/>
<line x1="150" y1="342" x2="1000" y2="342" stroke="#2F6F9F" stroke-width="5" stroke-linecap="round"/>
<line x1="150" y1="462" x2="1000" y2="462" stroke="#2F6F9F" stroke-width="5" stroke-linecap="round"/>

<text x="134" y="217" font-size="13" font-weight="700" fill="#14130F" text-anchor="end">2018 가을</text>
<text x="134" y="236" font-size="11.5" fill="#9A938A" text-anchor="end">자유 = 예속</text>
<text x="134" y="337" font-size="13" font-weight="700" fill="#14130F" text-anchor="end">2018 겨울</text>
<text x="134" y="356" font-size="11.5" fill="#9A938A" text-anchor="end">무지 = 힘</text>
<text x="134" y="457" font-size="13" font-weight="700" fill="#14130F" text-anchor="end">2026 봄</text>
<text x="134" y="476" font-size="11.5" fill="#9A938A" text-anchor="end">전쟁 = 평화</text>

<path d="M541 222 L541 198 L565 198" fill="none" stroke="#9A938A" stroke-width="1.5"/>
<text x="533" y="190" font-size="11.5" fill="#9A938A" text-anchor="end">직각이라야 천이 된다</text>

