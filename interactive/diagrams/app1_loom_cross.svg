<text x="56" y="632" font-size="11.5" fill="#9A938A"><tspan fill="#C8442A" font-weight="700">세로 = 🔥 낭만</tspan>(원하는 것) · <tspan fill="#2F6F9F" font-weight="700">가로 = 🧊 의심</tspan>(재는 것) · 매듭 셋은 누르면 그 장으로 간다</text>
