<style> @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap'); svg{--paper:#FBFAF7;--ink:#14130F;--dim:#5E584E;--faint:#9A938A;--wall:#14130F;--c1:#0026FB;--c2:#491786;--c3:#F82218;--c4:#006610;--c5:#B08400} @media (prefers-color-scheme: dark){ svg{--paper:#121311;--ink:#ECEAE4;--dim:#A8A399;--faint:#7D786F;--wall:#CFC9BF;--c1:#5A74FF;--c2:#A77BE0;--c3:#FF6B5E;--c4:#3FBF5A;--c5:#FFD53A} } .ttl{font-family:"Noto Serif KR",ui-serif,Georgia,serif} a.room{cursor:pointer} a.room .hit{fill:var(--ink);fill-opacity:0;pointer-events:all} a.room:hover .hit,a.room:focus .hit{fill-opacity:0.06} a.room:hover .seatname,a.room:focus .seatname{text-decoration:underline;text-underline-offset:4px} a.room:focus .hit{fill-opacity:0.06;stroke:var(--ink);stroke-width:1.5} a.room:focus{outline:none}</style>
<text class="ttl" x="56" y="58" font-size="27" font-weight="700" fill="var(--ink)">다섯 방 — 열 장이 사는 집</text>
<text x="56" y="82" font-size="12.5" fill="var(--dim)">자리는 여덟인데 방은 다섯이다. 짝이 둘씩 한 방에 산다 — <tspan font-weight="700">짝을 떼면 사슬이 끊긴다.</tspan> 안쪽에 사는 넷(1~4)이 빚을 쓰고, 바깥에서 돌아온 넷(6~9)이 갚는다.</text>
<text x="56" y="104" font-size="12.5" fill="var(--dim)"><tspan font-weight="700">문은 다섯인데 걸음은 열이다</tspan> — 같은 문을 두 번 지난다. 위 두 방이 <tspan font-weight="700">수축</tspan>하면 아래 두 방이 <tspan font-weight="700">박동</tspan>한다. 심장 한 바퀴다.</text>
<text x="104" y="128" font-size="11" font-weight="700" fill="var(--faint)" letter-spacing="0.14em">못 잰다 · 사용가치 · 수축</text>
