<text x="56" y="736" font-size="12" fill="#5E584E">가운데 방은 <tspan font-weight="700">두 번 지난다</tspan> — 5장에서 돌아서고(단기), 10장에서 닫는다(장기). 그래서 이 집에 들어왔다 나가는 길은 열 번이 아니라 <tspan font-weight="700">다섯 방 × 두 번</tspan>이다.</text>
<text x="56" y="758" font-size="11.5" fill="#9A938A">띠 색 = 짝색(1↔6 파랑 · 2↔7 보라 · 3↔8 빨강 · 4↔9 초록 · 5↔10 노랑). 이 그림은 <tspan font-style="italic">잰 값이 아니라 배치</tspan>다 — 숫자는 들어 있지 않다. <tspan font-weight="700">방 안의 이름을 누르면 그 장으로 간다.</tspan></text>
