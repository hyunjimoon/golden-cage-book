<text x="755" y="128" font-size="11" fill="#9A938A">둘째 바퀴 · 세 · 갚는다</text>
<text x="56" y="716" font-size="12" fill="#5E584E">문 다섯을 두 번 지나 <tspan font-weight="700">걸음이 열</tspan>이다 — 모서리 열 = 가로 여덟 + <tspan font-weight="700">이음새 둘</tspan>. 가운데 방도 두 번 지난다 — 5장에서 돌아서고(단기), 10장에서 닫는다(장기).</text>
<text x="56" y="738" font-size="12" fill="#5E584E">복도 셋은 <tspan font-weight="700">한 무리 안</tspan>(1~4 · 6~9)이라 순서를 바꿔도 되고, 가운데 문 둘은 <tspan font-weight="700">고정점</tspan>(5🐀 · 10🧫)에 닿아 못 바꾼다 — 4+4+2. 굵은 글자 = 손에 들려 가는 물건. <tspan font-weight="700">여섯 모서리는 비어 있다 — 비운 채로 둔다.</tspan></text>
<text x="56" y="760" font-size="11.5" fill="#9A938A">거울짝 다섯은 둘레가 아니라 <tspan font-style="italic">한 방에 겹친 두 자리</tspan>다(점 반전) — 띠 색 = 짝색(1↔6 파랑 · 2↔7 보라 · 3↔8 빨강 · 4↔9 초록 · 5↔10 노랑). 이 그림은 잰 값이 아니라 배치다. <tspan font-weight="700">방 안의 이름을 누르면 그 장으로 간다.</tspan></text>
