<text x="755" y="128" font-size="11" fill="var(--faint)">둘째 바퀴 · 세 · 갚는다</text>
<text x="56" y="716" font-size="12" fill="var(--dim)">문 다섯을 두 번 지나 <tspan font-weight="700">걸음이 열</tspan>이다 — 모서리 열 = 가로 여덟 + <tspan font-weight="700">이음새 둘</tspan>. 가운데 방도 두 번 지난다 — 5장에서 돌아서고(단기), 10장에서 닫는다(장기).</text>
<text x="56" y="738" font-size="12" fill="var(--dim)">복도 셋은 <tspan font-weight="700">한 무리 안</tspan>(1~4 · 6~9)이라 순서를 바꿔도 되고, 가운데 문 둘은 <tspan font-weight="700">고정점</tspan>(5🐀 · 10🧫)에 닿아 못 바꾼다 — 4+4+2. 굵은 글자 = 손에 들려 가는 물건, 점선 = 아직 없는 자리.</text>
<text x="56" y="760" font-size="12" fill="var(--dim)"><tspan font-weight="700">넘기는 선언은 열 중 다섯이다</tspan> — 걸음 1·2·3·4·5가 섰고 6·7·8·9·10이 비었다(§結 전수 2026-11-13). 흘끗 보이는 소품은 열 중 <tspan font-weight="700">열</tspan>이다. 빠진 것은 카메라가 아니라 <tspan font-weight="700">손</tspan>이다.</text>
<text x="56" y="782" font-size="11.5" fill="var(--faint)">거울짝 다섯은 둘레가 아니라 <tspan font-style="italic">한 방에 겹친 두 자리</tspan>다(점 반전) — 방 색 = 짝색(1↔6 파랑 · 2↔7 보라 · 3↔8 빨강 · 4↔9 초록 · 5↔10 노랑). 이 그림은 잰 값이 아니라 배치다. <tspan font-weight="700">방 안의 이름을 누르면 그 장으로 간다.</tspan></text>
</svg>