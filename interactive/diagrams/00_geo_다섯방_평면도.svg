<style> a.room{cursor:pointer} a.room .hit{fill:#14130F;fill-opacity:0;pointer-events:all} a.room:hover .hit,a.room:focus .hit{fill-opacity:0.045} a.room:hover .seatname,a.room:focus .seatname{text-decoration:underline} a.room:focus{outline:none}</style>
<text x="56" y="56" font-size="20" font-weight="700" fill="#14130F">다섯 방 — 열 장이 사는 집</text>
<text x="56" y="82" font-size="12.5" fill="#5E584E">자리는 여덟인데 방은 다섯이다. 짝이 둘씩 한 방에 산다 — <tspan font-weight="700">짝을 떼면 사슬이 끊긴다.</tspan> 안쪽에 사는 넷(1~4)이 빚을 쓰고, 바깥에서 돌아온 넷(6~9)이 갚는다.</text>
<text x="56" y="104" font-size="12.5" fill="#5E584E">문은 고리 차례다 — 위 두 방이 <tspan font-weight="700">수축</tspan>하면 아래 두 방이 <tspan font-weight="700">박동</tspan>한다. 심장 한 바퀴다.</text>
<text x="104" y="128" font-size="11" font-weight="700" fill="#9A938A" letter-spacing="0.14em">못 잰다 · 사용가치 · 수축</text>
<text x="104" y="488" font-size="11" font-weight="700" fill="#9A938A" letter-spacing="0.14em">잰다 · 교환가치 · 박동 · $ · 시간 · 확률</text>
