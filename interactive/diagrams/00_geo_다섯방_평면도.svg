<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 820" width="1060" height="820" role="img" aria-label="다섯 방 평면도. 짝 넷이 네 모서리에 한 방씩 들고, 가운데 기억 방을 두 번 지난다. 문은 다섯이고 같은 문을 두 번 지나 걸음이 열이다 — 복도 셋은 한 무리 안, 가운데 문 둘은 고정점." font-family="Noto Sans KR, Apple SD Gothic Neo, Helvetica Neue, Arial, sans-serif">
