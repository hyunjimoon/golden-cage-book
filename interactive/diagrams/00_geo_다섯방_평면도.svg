<text x="44" y="928" class="sm">지름 다섯이 <tspan fill="#2b2620" font-weight="700">한 점에서 만난다</tspan> — 마주 본 둘이 거울짝이다. <tspan fill="#2b2620">중심을 지나 뒤집으면</tspan> 짝이 된다.</text>
<text x="44" y="954" class="sm">굵은 쪽이 둥지다. 5번과 10번만 대사가 <tspan font-weight="700" fill="#8A6A12">0줄</tspan>이고 열 장 중 가장 짧다 — 방이 아니라 <tspan font-weight="700" fill="#8A6A12">이음새</tspan>다.</text>
<text x="44" y="982" class="nm" font-weight="700" fill="#8A6A12">빌린 것을 갚으면, 새장이 둥지가 된다.</text>
