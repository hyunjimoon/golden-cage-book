<text x="150" y="104" font-size="78" font-weight="700" fill="#1B1B1E">투향 — 물레 한 대</text>
<text x="150" y="164" font-size="32" fill="#5E584E">꼭지점 아홉은 <tspan font-weight="700">상태</tspan>, 1에서 10은 <tspan font-weight="700">모서리</tspan>다 — 장은 방이 아니라 건너가는 일이다. 10이 101에서 기준을 거쳐 욕망으로 돌아와 고리가 닫힌다.</text>
<text x="150" y="214" font-size="32" fill="#5E584E">골격은 물레다 — 흰 마름모와 십자는 실뽑기 사진의 그 틀, 가운데 <tspan font-weight="700" fill="#E0A526">101</tspan>이 굴대.</text>
<text x="150" y="268" font-size="34" font-weight="700" fill="#E0A526">여기는 상징과 행동지침만. 전체 그림과 세부는 카드를 눌러 원고에서 연다.</text>
<rect x="150" y="3493" width="56" height="38" rx="5" fill="#2D5FA8"/>
<text x="224" y="3523" font-size="34" font-weight="700" fill="#2D5FA8">새장 1·2·3·4</text>
<rect x="630" y="3493" width="56" height="38" rx="5" fill="#E0A526"/>
<text x="704" y="3523" font-size="34" font-weight="700" fill="#E0A526">101 들고남 5·10</text>
<rect x="1174" y="3493" width="56" height="38" rx="5" fill="#C8102E"/>
<text x="1248" y="3523" font-size="34" font-weight="700" fill="#C8102E">둥지 6·7·8·9</text>
<text x="150" y="3595" font-size="28" fill="#8A8477">🌗 모서리마다 넘어가는 물건은 아직 안 쟀다 — #168 의 빈칸으로 남겨 둔다. 수가 다른 것(꼭지점 9 · 모서리 10 · 거울짝 5)은 칸이 아니라 축이다.</text>
