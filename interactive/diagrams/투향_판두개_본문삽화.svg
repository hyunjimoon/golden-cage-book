<text x="56" y="1288" font-size="11.5" fill="#6E6961">빗금 날개는 판을 뚫는 팔이 낀 날개, 점선 날개는 판에 누운 날개다. 두 날개가 어긋나 한 판만으로는 점대칭이 아니다 — 그것이 뒤틀림이고, 그래서 판이 둘이다.</text>
<text x="56" y="1314" font-size="11.5" font-weight="700" fill="#14130F">한 글자 비틂 — <tspan font-weight="400" fill="#6E6961">뒤집으면 무엇이 무엇으로 바뀌나</tspan></text>
<text x="56" y="1336" font-size="11.5" fill="#6E6961"><tspan font-weight="700" fill="#14130F">1↔6</tspan>  모르고 입기 → 알면서 입기</text>
<text x="508" y="1336" font-size="11.5" fill="#6E6961"><tspan font-weight="700" fill="#14130F">2↔7</tspan>  관조 마비 → 분포 사고</text>
<text x="56" y="1356" font-size="11.5" fill="#6E6961"><tspan font-weight="700" fill="#14130F">3↔8</tspan>  닫힌 확신 → 열린 협상</text>
<text x="508" y="1356" font-size="11.5" fill="#6E6961"><tspan font-weight="700" fill="#14130F">4↔9</tspan>  빌린 질서 → 正→遺 명명</text>
<text x="56" y="1376" font-size="11.5" fill="#6E6961"><tspan font-weight="700" fill="#14130F">5↔10</tspan>  빚을 쓴다 → 빚을 갚는다</text>
