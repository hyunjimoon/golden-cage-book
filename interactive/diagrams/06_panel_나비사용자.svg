<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    .t  { fill: #2D5FA8; }
    .ink{ fill: #2b2620; }
    .gy { fill: #6a6355; }
    .h  { fill: #8A6A12; }
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>

  <!-- ① 제목줄 -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" class="t">6장 나비 — 사용자</text>
  <text x="480" y="46" text-anchor="middle" font-size="10" class="gy" letter-spacing="2">S 원함 | 벗을 조항을 지우지 마라 | M. 버터플라이 × 텐센트</text>

  <!-- ② 좌측 표제 카드 -->
  <rect x="50" y="68" width="210" height="295" rx="5" fill="none" stroke="#2D5FA8" stroke-width="2.5"/>
  <path d="M 50,68 Q 155,42 260,68" fill="none" stroke="#2D5FA8" stroke-width="2.5"/>
  <!-- 나비 -->
  <g stroke="#2D5FA8" fill="none" stroke-width="1.6">
    <path d="M 155 118 C 118 88, 96 122, 122 146 C 136 158, 150 152, 155 142 Z"/>
    <path d="M 155 118 C 192 88, 214 122, 188 146 C 174 158, 160 152, 155 142 Z"/>
    <path d="M 155 142 C 132 166, 128 190, 146 198 C 154 201, 155 190, 155 178 Z"/>
    <path d="M 155 142 C 178 166, 182 190, 164 198 C 156 201, 155 190, 155 178 Z"/>
    <line x1="155" y1="112" x2="155" y2="182" stroke-width="2"/>
    <path d="M 155 112 C 150 102, 144 98, 140 97" stroke-width="1.2"/>
    <path d="M 155 112 C 160 102, 166 98, 170 97" stroke-width="1.2"/>
  </g>
  <text x="155" y="238" text-anchor="middle" font-size="15" font-weight="700" class="t" letter-spacing="3">나비</text>
  <text x="155" y="259" text-anchor="middle" font-size="10.5" class="ink">옷인 줄 알고 입는다</text>
  <text x="155" y="275" text-anchor="middle" font-size="8.5" class="gy">엠마는 살인 줄 알고 삼켰다 — 단어 하나 차이</text>
  <text x="155" y="301" text-anchor="middle" font-size="9" class="gy">송 릴링 — 법정에서 단추를 푼다</text>
  <text x="155" y="316" text-anchor="middle" font-size="9" class="gy">텐센트 — 빌린 이름을 알고 입었다</text>
  <text x="155" y="343" text-anchor="middle" font-size="10" class="t" font-style="italic">"이 환상은 그들의 원함인가,</text>
  <text x="155" y="356" text-anchor="middle" font-size="10" class="t" font-style="italic">내 원함인가?"</text>

  <line x1="300" y1="58" x2="300" y2="395" stroke="#d8cfbc" stroke-width="1"/>

  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D5FA8"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6355"/>
    </marker>
  </defs>

  <!-- ③ 중앙 개념도 — 세 시점의 사용자, 회전축은 ★멈춤 -->
  <circle cx="516" cy="170" r="10" fill="#E0A526"/>
  <circle cx="516" cy="170" r="18" fill="none" stroke="#8A6A12" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="516" y="196" text-anchor="middle" font-size="8" font-weight="700" class="h">★멈춤 = 회전축</text>

  <line x1="500" y1="160" x2="456" y2="139" stroke="#2D5FA8" stroke-width="1.3"/>
  <line x1="532" y1="160" x2="586" y2="132" stroke="#2D5FA8" stroke-width="1.3"/>
  <line x1="516" y1="188" x2="516" y2="222" stroke="#2D5FA8" stroke-width="1.3"/>

  <text x="424" y="114" text-anchor="middle" font-size="9.5" font-weight="700" class="t">과거 · 성찰</text>
  <text x="424" y="126" text-anchor="middle" font-size="7.5" class="gy">쌓인 기록에서 못 뽑은 것을 캔다</text>

  <text x="608" y="120" text-anchor="middle" font-size="9.5" font-weight="700" class="t">미래 · 시뮬레이션</text>
  <text x="608" y="132" text-anchor="middle" font-size="7.5" class="gy">아직 안 온 사용자를 상상한다</text>
  <rect x="556" y="140" width="104" height="17" rx="2" fill="none" stroke="#2D5FA8" stroke-width="1.4"/>
  <text x="608" y="152" text-anchor="middle" font-size="8.5" font-weight="700" class="t">비틂 · 믿음 → 실험</text>

  <text x="516" y="236" text-anchor="middle" font-size="9.5" font-weight="700" class="t">현재 · 반복</text>
  <text x="516" y="248" text-anchor="middle" font-size="7.5" class="gy">지금 무엇을 켜고 끄나</text>

  <text x="516" y="274" text-anchor="middle" font-size="9.5" class="ink">시뮬레이션을 믿음으로 굳히면 새장, 시뮬레이션인 줄 알고 굴리면 둥지</text>

  <!-- ④ 분기 -->
  <circle cx="516" cy="300" r="12" fill="none" stroke="#2D5FA8" stroke-width="1.2"/>
  <text x="516" y="304" text-anchor="middle" font-size="8.5" font-weight="700" class="t">분기</text>

  <path d="M 503 304 C 466 310, 442 314, 432 320" fill="none" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#agy)"/>
  <rect x="358" y="328" width="140" height="50" rx="3" fill="none" stroke="#6a6355" stroke-width="0.7" stroke-dasharray="5,4"/>
  <text x="428" y="344" text-anchor="middle" font-size="10" font-weight="700" class="gy">모르고 삼킨다</text>
  <text x="428" y="357" text-anchor="middle" font-size="8" class="gy">다운로드로 잰다 — 옷이 그를 고른다</text>
  <text x="428" y="370" text-anchor="middle" font-size="8" class="gy">"궁극적 결합" 선언 3주 뒤 내부 서한</text>

  <path d="M 529 304 C 566 310, 590 314, 600 320" fill="none" stroke="#2D5FA8" stroke-width="2.2" marker-end="url(#ad)"/>
  <rect x="540" y="328" width="144" height="50" rx="3" fill="#2D5FA8" fill-opacity="0.05" stroke="#2D5FA8" stroke-width="1.4"/>
  <text x="612" y="344" text-anchor="middle" font-size="10" font-weight="700" class="t">알고 입는다</text>
  <text x="612" y="357" text-anchor="middle" font-size="8" class="ink">어제 자발적으로 켠 손으로 잰다</text>
  <text x="612" y="370" text-anchor="middle" font-size="8" class="ink">알림으로 산 클릭은 0으로 친다</text>

  <!-- ⑤ 우측 앵커 카드 -->
  <rect x="740" y="90" width="185" height="130" rx="4" fill="none" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="111" text-anchor="middle" font-size="10.5" font-weight="700" class="t">고르기의 앞 구절을 지우지 마라</text>
  <text x="832" y="130" text-anchor="middle" font-size="8.5" class="ink">벗을 수 있는 것 안에서,</text>
  <text x="832" y="144" text-anchor="middle" font-size="8.5" class="ink">가장 끌리는 것을 고른다</text>
  <text x="832" y="161" text-anchor="middle" font-size="8" class="gy">환상을 입는 것은 죄가 아니다 —</text>
  <text x="832" y="173" text-anchor="middle" font-size="8" class="gy">벗을 조항을 지우는 것이 죄다</text>
  <line x1="758" y1="184" x2="906" y2="184" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="200" text-anchor="middle" font-size="8.5" class="gy">반례 · 짐작은 반쯤 틀렸다</text>
  <text x="832" y="214" text-anchor="middle" font-size="8.5" class="gy">→ 기능이 아니라 관계가 자리를 쥐고 있었다</text>

  <!-- ⑥ 하단 결론 = 「⭐️ 네 자리」 원문 -->
  <line x1="50" y1="393" x2="910" y2="393" stroke="#d8cfbc" stroke-width="1"/>
  <text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="700" class="ink">빌린 옷을 입되, 언제 벗을지 고르는 조항을 계약서에서 지우지 마라</text>

  <!-- ⑦ 이월 화살 -->
  <text x="480" y="433" text-anchor="middle" font-size="9.5" class="gy">→ 이월 · "무대 위의 환상이, 이제 흙 속에서 확률로 자란다" → 7장</text>
</svg>
