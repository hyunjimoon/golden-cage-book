<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    .t  { fill: #C8102E; }
    .ink{ fill: #2b2620; }
    .gy { fill: #6a6355; }
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>

  <!-- ① 제목줄 -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" class="t">3장 스테인굴레스새장 — 설득해</text>
  <text x="480" y="46" text-anchor="middle" font-size="10" class="gy" letter-spacing="2">A 행동 | 혈청을 바꿔라, 손으로 | 페스트 × Theranos</text>

  <!-- ② 좌측 표제 카드 -->
  <rect x="50" y="68" width="210" height="295" rx="5" fill="none" stroke="#C8102E" stroke-width="2.5"/>
  <path d="M 50,68 Q 155,42 260,68" fill="none" stroke="#C8102E" stroke-width="2.5"/>
  <!-- 스테인굴레스 창 -->
  <g stroke="#C8102E" stroke-width="1.4">
    <path d="M 112 200 L 112 128 Q 155 92 198 128 L 198 200 Z" fill="#C8102E" fill-opacity="0.06"/>
    <line x1="155" y1="96" x2="155" y2="200"/>
    <line x1="112" y1="140" x2="198" y2="140"/>
    <line x1="112" y1="170" x2="198" y2="170"/>
    <path d="M 112 128 Q 155 158 198 128" fill="none" stroke-width="1"/>
  </g>
  <rect x="126" y="144" width="24" height="22" fill="#C8102E" fill-opacity="0.16"/>
  <rect x="160" y="174" width="24" height="22" fill="#C8102E" fill-opacity="0.16"/>
  <text x="155" y="234" text-anchor="middle" font-size="14" font-weight="700" class="t" letter-spacing="2">스테인굴레스 새장</text>
  <text x="155" y="256" text-anchor="middle" font-size="10.5" class="ink">아름다운데, 바깥이 안 보인다</text>
  <text x="155" y="286" text-anchor="middle" font-size="9" class="gy">파늘루 — 원인·결과·처방 한 문장, 불확실성 0</text>
  <text x="155" y="301" text-anchor="middle" font-size="9" class="gy">Theranos — 약속의 속도가 능력을 앞질렀다</text>
  <text x="155" y="338" text-anchor="middle" font-size="10" class="t" font-style="italic">"내 확신이 지금 누구의</text>
  <text x="155" y="351" text-anchor="middle" font-size="10" class="t" font-style="italic">자원을 담보로 잡고 있나?"</text>

  <line x1="300" y1="58" x2="300" y2="395" stroke="#d8cfbc" stroke-width="1"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8102E"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6355"/>
    </marker>
  </defs>

  <!-- ③ 중앙 개념도 — 확신도 장부 -->
  <line x1="372" y1="88" x2="372" y2="242" stroke="#d8cfbc" stroke-width="1"/>
  <line x1="372" y1="242" x2="694" y2="242" stroke="#d8cfbc" stroke-width="1"/>
  <text x="366" y="103" text-anchor="end" font-size="7.5" class="gy">100%</text>
  <text x="366" y="245" text-anchor="end" font-size="7.5" class="gy">0%</text>
  <text x="533" y="257" text-anchor="middle" font-size="8" class="gy">시간 · 결과가 들어온다 →</text>

  <!-- 데이터 사건 -->
  <line x1="520" y1="88" x2="520" y2="242" stroke="#6a6355" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="520" y="84" text-anchor="middle" font-size="8" class="ink">아이가 죽는다</text>

  <!-- 파늘루: 100% 고정 -->
  <line x1="384" y1="100" x2="686" y2="100" stroke="#6a6355" stroke-width="2"/>
  <text x="686" y="94" text-anchor="end" font-size="8.5" class="gy">파늘루 — 100%, 수정 없음</text>
  <circle cx="520" cy="100" r="4" fill="none" stroke="#6a6355" stroke-width="1.4"/>
  <text x="576" y="115" text-anchor="middle" font-size="8" class="gy">데이터가 와도 침묵</text>

  <!-- 리외: 60% → 30% -->
  <polyline points="384,156 520,156 556,198 686,198" fill="none" stroke="#C8102E" stroke-width="2.4"/>
  <circle cx="520" cy="156" r="4" fill="#C8102E"/>
  <text x="452" y="150" text-anchor="middle" font-size="8.5" class="t">리외 — 60%</text>
  <text x="640" y="192" text-anchor="middle" font-size="8.5" class="t">30%</text>
  <text x="612" y="216" text-anchor="middle" font-size="8" class="ink">혈청을 바꾼다 — 손으로</text>
  <line x1="612" y1="205" x2="612" y2="196" stroke="#C8102E" stroke-width="1" marker-start="url(#ar)"/>

  <text x="533" y="278" text-anchor="middle" font-size="9.5" class="ink">확신이 검증을 앞지르면, 그 간극이 빚이 된다</text>

  <!-- ④ 분기 -->
  <circle cx="520" cy="302" r="12" fill="none" stroke="#C8102E" stroke-width="1.2"/>
  <text x="520" y="306" text-anchor="middle" font-size="8.5" font-weight="700" class="t">분기</text>

  <path d="M 507 306 C 470 312, 446 316, 436 322" fill="none" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#agy)"/>
  <rect x="366" y="330" width="132" height="48" rx="3" fill="none" stroke="#6a6355" stroke-width="0.7" stroke-dasharray="5,4"/>
  <text x="432" y="346" text-anchor="middle" font-size="10" font-weight="700" class="gy">숫자만 내린다</text>
  <text x="432" y="359" text-anchor="middle" font-size="8" class="gy">"80%로 내렸습니다" — 손은 그대로</text>
  <text x="432" y="372" text-anchor="middle" font-size="8" class="gy">240가지 약속 → 15가지</text>

  <path d="M 533 306 C 570 312, 594 316, 604 322" fill="none" stroke="#C8102E" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="544" y="330" width="136" height="48" rx="3" fill="#C8102E" fill-opacity="0.05" stroke="#C8102E" stroke-width="1.2"/>
  <text x="612" y="346" text-anchor="middle" font-size="10" font-weight="700" class="t">손이 따라 움직인다</text>
  <text x="612" y="359" text-anchor="middle" font-size="8" class="ink">숫자를 내리고 혈청을 바꾼다</text>
  <text x="612" y="372" text-anchor="middle" font-size="8" class="ink">10년 침묵 → 63일 만에 백신</text>

  <!-- ⑤ 우측 앵커 카드 -->
  <rect x="740" y="90" width="185" height="122" rx="4" fill="none" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="111" text-anchor="middle" font-size="10.5" font-weight="700" class="t">신념과 확신을 갈라라</text>
  <text x="832" y="130" text-anchor="middle" font-size="8.5" class="ink">신념 = 무엇을 믿는가 (내용)</text>
  <text x="832" y="145" text-anchor="middle" font-size="8.5" class="ink">확신 = 결과 앞에서 고칠 수 있는가 (의지)</text>
  <text x="832" y="160" text-anchor="middle" font-size="8.5" class="gy">둘 다 강했다 — 다른 건 확신뿐이었다</text>
  <line x1="758" y1="171" x2="906" y2="171" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="187" text-anchor="middle" font-size="8.5" class="gy">반례 · 파늘루는 비겁하지 않았다</text>
  <text x="832" y="202" text-anchor="middle" font-size="8.5" class="gy">→ 제 몸으로 그 확신을 살고 죽었다</text>

  <!-- ⑥ 하단 결론 = 「⭐️ 네 자리」 원문 -->
  <line x1="50" y1="393" x2="910" y2="393" stroke="#d8cfbc" stroke-width="1"/>
  <text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="700" class="ink">확신도가 내려가면 혈청을 바꿔라 — 손으로</text>

  <!-- ⑦ 이월 화살 -->
  <text x="480" y="433" text-anchor="middle" font-size="9.5" class="gy">→ 이월 · "매일의 판단은 질서가 되고, 질서는 뒤집기를 금한다" → 4장</text>
</svg>
