<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    .t  { fill: #B0821F; }
    .ink{ fill: #2b2620; }
    .gy { fill: #6a6355; }
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>

  <!-- ① 제목줄 -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" class="t">2장 망원경새장 — 상상해</text>
  <text x="480" y="46" text-anchor="middle" font-size="10" class="gy" letter-spacing="2">B 믿음 | 출시 버튼을 눌러라 | 표범 × 필름·소재 산업</text>

  <!-- ② 좌측 표제 카드 -->
  <rect x="50" y="68" width="210" height="295" rx="5" fill="none" stroke="#B0821F" stroke-width="2.5"/>
  <path d="M 50,68 Q 155,42 260,68" fill="none" stroke="#B0821F" stroke-width="2.5"/>
  <!-- 망원경 -->
  <g stroke="#B0821F" fill="none">
    <path d="M 108 148 L 186 106 L 198 126 L 120 168 Z" stroke-width="1.8"/>
    <line x1="105" y1="142" x2="117" y2="163" stroke-width="3"/>
    <line x1="190" y1="112" x2="202" y2="132" stroke-width="1.4"/>
    <line x1="152" y1="150" x2="152" y2="196" stroke-width="1.6"/>
    <line x1="152" y1="196" x2="132" y2="216" stroke-width="1.6"/>
    <line x1="152" y1="196" x2="172" y2="216" stroke-width="1.6"/>
  </g>
  <text x="155" y="243" text-anchor="middle" font-size="15" font-weight="700" class="t" letter-spacing="3">망원경 새장</text>
  <text x="155" y="264" text-anchor="middle" font-size="10.5" class="ink">당겨 보여주되, 데려다주지 않는다</text>
  <text x="155" y="294" text-anchor="middle" font-size="9" class="gy">살리나 — 천문대에서 혁명을 듣는다</text>
  <text x="155" y="309" text-anchor="middle" font-size="9" class="gy">필름·소재 산업 — 먼저 발명한 것을 보기만</text>
  <text x="155" y="343" text-anchor="middle" font-size="10" class="t" font-style="italic">"내 정확한 눈이 어떤</text>
  <text x="155" y="356" text-anchor="middle" font-size="10" class="t" font-style="italic">행동을 면제하고 있나?"</text>

  <line x1="300" y1="58" x2="300" y2="395" stroke="#d8cfbc" stroke-width="1"/>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B0821F"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6355"/>
    </marker>
  </defs>

  <!-- ③ 중앙 개념도 — 렌즈는 봄을 당기고, 길은 못 당긴다 -->
  <circle cx="378" cy="140" r="26" fill="none" stroke="#B0821F" stroke-width="1.5"/>
  <circle cx="378" cy="140" r="7" fill="none" stroke="#B0821F" stroke-width="1.2"/>
  <text x="378" y="182" text-anchor="middle" font-size="10" font-weight="700" class="t">눈</text>

  <path d="M 500 116 Q 520 140 500 164 Q 480 140 500 116 Z" fill="none" stroke="#B0821F" stroke-width="1.5"/>
  <text x="500" y="182" text-anchor="middle" font-size="10" font-weight="700" class="t">렌즈</text>

  <path d="M 646 120 l 7 21 l 22 0 l -18 14 l 7 21 l -18 -13 l -18 13 l 7 -21 l -18 -14 l 22 0 z" fill="none" stroke="#B0821F" stroke-width="1.4"/>
  <text x="653" y="182" text-anchor="middle" font-size="10" font-weight="700" class="t">별</text>

  <line x1="620" y1="128" x2="412" y2="128" stroke="#B0821F" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="583" y="119" text-anchor="middle" font-size="8.5" class="t">당긴다 — 봄은 온다</text>

  <line x1="412" y1="158" x2="512" y2="158" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="556" y1="158" x2="620" y2="158" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#agy)"/>
  <line x1="524" y1="149" x2="544" y2="167" stroke="#6a6355" stroke-width="1.4"/>
  <line x1="544" y1="149" x2="524" y2="167" stroke="#6a6355" stroke-width="1.4"/>
  <text x="516" y="200" text-anchor="middle" font-size="8.5" class="gy">데려다주지 않는다 — 길은 안 온다</text>

  <text x="516" y="228" text-anchor="middle" font-size="9.5" class="ink">진단이 정확할수록, 안 움직일 알리바이가 된다</text>
  <text x="516" y="244" text-anchor="middle" font-size="8.5" class="gy">머리는 갱신되는데 몸이 먼저 거절한다 — habitus</text>

  <!-- ④ 분기 -->
  <circle cx="520" cy="286" r="13" fill="none" stroke="#B0821F" stroke-width="1.2"/>
  <text x="520" y="290" text-anchor="middle" font-size="9" font-weight="700" class="t">분기</text>

  <path d="M 506 291 C 468 300, 444 306, 434 314" fill="none" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#agy)"/>
  <rect x="366" y="322" width="132" height="52" rx="3" fill="none" stroke="#6a6355" stroke-width="0.7" stroke-dasharray="5,4"/>
  <text x="432" y="339" text-anchor="middle" font-size="10" font-weight="700" class="gy">관조 — 살리나</text>
  <text x="432" y="353" text-anchor="middle" font-size="8" class="gy">네 번째 다시 들여다본다</text>
  <text x="432" y="367" text-anchor="middle" font-size="8" class="gy">73년 중 진짜 산 시간 2년</text>

  <path d="M 534 291 C 572 300, 596 306, 606 314" fill="none" stroke="#B0821F" stroke-width="2.2" marker-end="url(#ag)"/>
  <rect x="544" y="322" width="136" height="52" rx="3" fill="none" stroke="#B0821F" stroke-width="2.2"/>
  <text x="612" y="339" text-anchor="middle" font-size="10" font-weight="700" class="t">출시 — 탄크레디</text>
  <text x="612" y="353" text-anchor="middle" font-size="8" class="ink">매혹된 채로도 움직인다</text>
  <text x="612" y="367" text-anchor="middle" font-size="8" class="ink">목숨을 걸고, 다리를 절며 돌아온다</text>

  <!-- ⑤ 우측 앵커 카드 -->
  <rect x="740" y="90" width="185" height="122" rx="4" fill="none" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="111" text-anchor="middle" font-size="10.5" font-weight="700" class="t">모호함을 둘로 갈라라</text>
  <text x="832" y="130" text-anchor="middle" font-size="8.5" class="ink">지금 뭘 할지 = 마찰 → 즉시 없앤다</text>
  <text x="832" y="145" text-anchor="middle" font-size="8.5" class="ink">무엇이 될지 = 선택지 → 남겨둔다</text>
  <text x="832" y="160" text-anchor="middle" font-size="8.5" class="gy">부르디외 habitus · 메디치의 자석</text>
  <line x1="758" y1="171" x2="906" y2="171" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="187" text-anchor="middle" font-size="8.5" class="gy">반례 · 셰발레이는 반박하지 못했다</text>
  <text x="832" y="202" text-anchor="middle" font-size="8.5" class="gy">→ 살리나의 진단은 전부 맞았다</text>

  <!-- ⑥ 하단 결론 = 「⭐️ 네 자리」 원문 -->
  <line x1="50" y1="393" x2="910" y2="393" stroke="#d8cfbc" stroke-width="1"/>
  <text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="700" class="ink">네 번째 들여다보는 대신, 한 번 출시 버튼을 눌러라</text>

  <!-- ⑦ 이월 화살 -->
  <text x="480" y="433" text-anchor="middle" font-size="9.5" class="gy">→ 이월 · "빠른 발은 확신을 낳고, 확신은 결과를 면제한다" → 3장</text>
</svg>
