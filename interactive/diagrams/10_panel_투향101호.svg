<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    .t  { fill: #8A6A12; }
    .ink{ fill: #2b2620; }
    .gy { fill: #6a6355; }
    .d  { fill: #2D5FA8; }
    .b  { fill: #B0821F; }
    .a  { fill: #C8102E; }
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>

  <!-- ① 제목줄 -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" class="t">10장 투향 — 101₃호</text>
  <text x="480" y="46" text-anchor="middle" font-size="10" class="gy" letter-spacing="2">이음새 | 넷을 넷으로 세라 | 1984 × 1,024개의 커밋</text>

  <!-- ② 좌측 표제 카드 — 5장의 그 방, 이번엔 따뜻하다 -->
  <rect x="50" y="68" width="210" height="295" rx="5" fill="none" stroke="#8A6A12" stroke-width="2.5"/>
  <path d="M 50,68 Q 155,42 260,68" fill="none" stroke="#8A6A12" stroke-width="2.5"/>
  <g stroke="#8A6A12" fill="none">
    <line x1="155" y1="86" x2="155" y2="118" stroke-width="1.4"/>
    <path d="M 138 132 L 172 132 L 164 118 L 146 118 Z" stroke-width="1.6"/>
    <line x1="132" y1="196" x2="178" y2="196" stroke-width="1.8"/>
    <line x1="132" y1="196" x2="132" y2="224" stroke-width="1.6"/>
    <line x1="178" y1="196" x2="178" y2="224" stroke-width="1.6"/>
    <line x1="178" y1="196" x2="178" y2="164" stroke-width="1.8"/>
    <line x1="178" y1="164" x2="196" y2="164" stroke-width="1.4"/>
  </g>
  <circle cx="155" cy="142" r="11" fill="#E0A526"/>
  <g stroke="#8A6A12" stroke-width="1" opacity="0.75">
    <line x1="129" y1="142" x2="121" y2="142"/>
    <line x1="181" y1="142" x2="189" y2="142"/>
    <line x1="137" y1="160" x2="131" y2="166"/>
    <line x1="173" y1="160" x2="179" y2="166"/>
    <line x1="155" y1="167" x2="155" y2="175"/>
  </g>
  <text x="155" y="252" text-anchor="middle" font-size="15" font-weight="700" class="t" letter-spacing="2">101₃호</text>
  <text x="155" y="273" text-anchor="middle" font-size="10.5" class="ink">빚을 갚는 방 — 뜨겁게</text>
  <text x="155" y="298" text-anchor="middle" font-size="9" class="gy">오브라이언의 손가락 — 다섯으로 보고 싶어지는 것</text>
  <text x="155" y="313" text-anchor="middle" font-size="9" class="gy">이 책 — 1,024개의 커밋으로 지어졌다</text>
  <text x="155" y="341" text-anchor="middle" font-size="10" class="t" font-style="italic">"지금 다섯으로 보고 싶어</text>
  <text x="155" y="354" text-anchor="middle" font-size="10" class="t" font-style="italic">하는 넷은 무엇인가?"</text>

  <line x1="300" y1="58" x2="300" y2="395" stroke="#d8cfbc" stroke-width="1"/>

  <defs>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D5FA8"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B0821F"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8102E"/>
    </marker>
    <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A6A12"/>
    </marker>
    <marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6355"/>
    </marker>
  </defs>

  <!-- ③ 중앙 개념도 — 10_geo 흡수: 세가 다를 이해한다 (5장과 점대칭) -->
  <line x1="360" y1="164" x2="672" y2="164" stroke="#d8cfbc" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="516" y1="84" x2="516" y2="244" stroke="#d8cfbc" stroke-width="0.6" stroke-dasharray="4,4"/>

  <line x1="498" y1="164" x2="396" y2="164" stroke="#B0821F" stroke-width="1.8" marker-end="url(#mb)"/>
  <text x="390" y="161" text-anchor="end" font-size="9.5" font-weight="700" class="b">세 — 믿음</text>
  <text x="390" y="174" text-anchor="end" font-size="7.5" class="gy">지켜보는 자</text>

  <line x1="516" y1="182" x2="516" y2="212" stroke="#2D5FA8" stroke-width="1.8" marker-end="url(#md)"/>
  <text x="520" y="227" text-anchor="middle" font-size="9.5" font-weight="700" class="d">다 — 원함</text>

  <path d="M 412 164 C 412 100, 620 100, 620 164 C 620 222, 452 224, 414 176" fill="none" stroke="#C8102E" stroke-width="2.2" stroke-dasharray="2,2" marker-end="url(#ma)"/>
  <text x="516" y="94" text-anchor="middle" font-size="9" font-weight="700" class="a">상환 — 세가 다를 이해한다</text>
  <text x="516" y="105" text-anchor="middle" font-size="7.5" class="gy">적분 순서를 바꿔도 값이 같다 · 빚 = 0</text>

  <circle cx="516" cy="164" r="9" fill="#E0A526"/>
  <circle cx="516" cy="164" r="17" fill="none" stroke="#8A6A12" stroke-width="1.4" stroke-dasharray="4,2"/>
  <text x="540" y="150" font-size="9.5" font-weight="700" class="t">세다</text>
  <text x="540" y="161" font-size="7.5" class="gy">빚 = 0인 이음새</text>
  <text x="400" y="216" text-anchor="end" font-size="7.5" class="gy">세 자리의 방 — 다·세·세다</text>

  <!-- 커밋 연대기 -->
  <g fill="#8A6A12">
    <rect x="400" y="277" width="12" height="1"/>
    <rect x="420" y="271" width="12" height="7"/>
    <rect x="440" y="256" width="12" height="22"/>
    <rect x="460" y="230" width="12" height="48"/>
    <rect x="480" y="266" width="12" height="12"/>
    <rect x="500" y="247" width="12" height="31"/>
    <rect x="520" y="249" width="12" height="29"/>
    <rect x="540" y="260" width="12" height="18"/>
  </g>
  <line x1="396" y1="278" x2="558" y2="278" stroke="#d8cfbc" stroke-width="1"/>
  <text x="466" y="224" text-anchor="middle" font-size="7" class="t">303</text>
  <text x="486" y="260" text-anchor="middle" font-size="7" class="gy">74</text>
  <text x="572" y="252" font-size="8.5" font-weight="700" class="ink">1,024개의 커밋</text>
  <text x="572" y="264" font-size="7.5" class="gy">3월 대폭발 303 — 은유가 도착한 달</text>
  <text x="572" y="276" font-size="7.5" class="gy">4월 침체 74 — 지친 게 아니라 비운 것</text>

  <!-- ④ 분기 -->
  <circle cx="516" cy="302" r="12" fill="none" stroke="#8A6A12" stroke-width="1.2"/>
  <text x="516" y="306" text-anchor="middle" font-size="8.5" font-weight="700" class="t">분기</text>

  <path d="M 503 306 C 466 312, 442 316, 432 322" fill="none" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#mgy)"/>
  <rect x="358" y="330" width="140" height="48" rx="3" fill="none" stroke="#6a6355" stroke-width="0.7" stroke-dasharray="5,4"/>
  <text x="428" y="346" text-anchor="middle" font-size="10" font-weight="700" class="gy">다섯으로 본다</text>
  <text x="428" y="359" text-anchor="middle" font-size="7.5" class="gy">빚을 못 느끼는 게 아니라 잴 자가 사라진다</text>
  <text x="428" y="372" text-anchor="middle" font-size="7.5" class="gy">되돌아간 자리 = 101₂호의 비명</text>

  <path d="M 529 306 C 566 312, 590 316, 600 322" fill="none" stroke="#8A6A12" stroke-width="2.2" marker-end="url(#mh)"/>
  <rect x="540" y="330" width="144" height="48" rx="3" fill="none" stroke="#8A6A12" stroke-width="1.6"/>
  <text x="612" y="346" text-anchor="middle" font-size="10" font-weight="700" class="t">다시 넷으로 센다</text>
  <text x="612" y="359" text-anchor="middle" font-size="7.5" class="ink">극적인 전향이 아니라 조용한 복원</text>
  <text x="612" y="372" text-anchor="middle" font-size="7.5" class="ink">문패의 마지막 자리는 비어 있다</text>

  <!-- ⑤ 우측 앵커 카드 -->
  <rect x="740" y="90" width="185" height="136" rx="4" fill="none" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="111" text-anchor="middle" font-size="10.5" font-weight="700" class="t">호러와 판타지 사이</text>
  <text x="832" y="130" text-anchor="middle" font-size="8.5" class="ink">호러만 믿으면 세계가 욕망을 억압하고</text>
  <text x="832" y="143" text-anchor="middle" font-size="8.5" class="ink">판타지만 믿으면 욕망이 세계를 오염한다</text>
  <text x="832" y="160" text-anchor="middle" font-size="8" class="gy">갇혀서 못 나가는 게 새장이라면,</text>
  <text x="832" y="172" text-anchor="middle" font-size="8" class="gy">열렸는데도 머무는 것이 둥지다</text>
  <line x1="758" y1="184" x2="906" y2="184" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="200" text-anchor="middle" font-size="8.5" class="gy">반례 · 원리가 아름다운 건 위험하다</text>
  <text x="832" y="215" text-anchor="middle" font-size="8.5" class="gy">→ 좋은 서사일수록 위험하다</text>

  <!-- ⑥ 하단 결론 = 「⭐️ 네 자리」 원문 -->
  <line x1="50" y1="393" x2="910" y2="393" stroke="#d8cfbc" stroke-width="1"/>
  <text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="700" class="ink">넷은 넷이다</text>

  <!-- ⑦ 이월 화살 — 우로보로스 봉합 -->
  <text x="480" y="433" text-anchor="middle" font-size="9.5" class="gy">→ 이월 · "마지막 문을 열면, 뜻밖에도 첫 방이다" → 1장</text>
</svg>
