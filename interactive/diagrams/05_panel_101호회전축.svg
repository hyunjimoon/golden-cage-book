<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    .t  { fill: #8A6A12; }
    .ink{ fill: #2b2620; }
    .gy { fill: #6a6355; }
    .d  { fill: #2D5FA8; }
    .b  { fill: #B0821F; }
    .a  { fill: #C8102E; }
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>

  <!-- ① 제목줄 -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" class="t">5장 101₂호 — 회전축멈춤</text>
  <text x="480" y="46" text-anchor="middle" font-size="10" class="gy" letter-spacing="2">이음새 | 한 박자를 벌어라 | 1984 × 다운라운드 이사회</text>

  <!-- ② 좌측 표제 카드 -->
  <rect x="50" y="68" width="210" height="295" rx="5" fill="none" stroke="#8A6A12" stroke-width="2.5"/>
  <path d="M 50,68 Q 155,42 260,68" fill="none" stroke="#8A6A12" stroke-width="2.5"/>
  <!-- 전등 하나와 빈 의자 -->
  <g stroke="#8A6A12" fill="none">
    <line x1="155" y1="86" x2="155" y2="118" stroke-width="1.4"/>
    <path d="M 138 132 L 172 132 L 164 118 L 146 118 Z" stroke-width="1.6"/>
    <circle cx="155" cy="139" r="4" fill="#E0A526" stroke="none"/>
    <line x1="132" y1="196" x2="178" y2="196" stroke-width="1.8"/>
    <line x1="132" y1="196" x2="132" y2="224" stroke-width="1.6"/>
    <line x1="178" y1="196" x2="178" y2="224" stroke-width="1.6"/>
    <line x1="178" y1="196" x2="178" y2="164" stroke-width="1.8"/>
    <line x1="178" y1="164" x2="196" y2="164" stroke-width="1.4"/>
  </g>
  <text x="155" y="252" text-anchor="middle" font-size="15" font-weight="700" class="t" letter-spacing="2">101₂호</text>
  <text x="155" y="273" text-anchor="middle" font-size="10.5" class="ink">빚을 쓰는 방 — 차갑게</text>
  <text x="155" y="298" text-anchor="middle" font-size="9" class="gy">윈스턴 — "줄리아에게 하세요"</text>
  <text x="155" y="313" text-anchor="middle" font-size="9" class="gy">다운라운드 이사회 — 되려던 것을 먼저 판다</text>
  <text x="155" y="341" text-anchor="middle" font-size="10" class="t" font-style="italic">"지렛대에 누구 손이</text>
  <text x="155" y="354" text-anchor="middle" font-size="10" class="t" font-style="italic">얹혀 있는가?"</text>

  <line x1="300" y1="58" x2="300" y2="395" stroke="#d8cfbc" stroke-width="1"/>

  <defs>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D5FA8"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B0821F"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8102E"/>
    </marker>
    <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A6A12"/>
    </marker>
    <marker id="mgy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6355"/>
    </marker>
  </defs>

  <!-- ③ 중앙 개념도 — 05_geo 흡수: 다가 세를 쏜다 (10장과 점대칭) -->
  <line x1="360" y1="176" x2="672" y2="176" stroke="#d8cfbc" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="516" y1="96" x2="516" y2="256" stroke="#d8cfbc" stroke-width="0.6" stroke-dasharray="4,4"/>

  <line x1="534" y1="176" x2="654" y2="176" stroke="#2D5FA8" stroke-width="1.8" marker-end="url(#md)"/>
  <text x="660" y="180" font-size="9.5" font-weight="700" class="d">다 — 원함</text>
  <text x="660" y="193" font-size="7.5" class="gy">앞서 달리는 자</text>

  <line x1="516" y1="158" x2="516" y2="112" stroke="#B0821F" stroke-width="1.8" marker-end="url(#mb)"/>
  <text x="516" y="104" text-anchor="middle" font-size="9.5" font-weight="700" class="b">세 — 믿음</text>

  <path d="M 540 168 Q 622 130 556 116" fill="none" stroke="#C8102E" stroke-width="2.4" stroke-dasharray="2,2" marker-end="url(#ma)"/>
  <text x="604" y="152" font-size="9" font-weight="700" class="a">오염</text>
  <text x="604" y="164" font-size="7.5" class="gy">원함이 믿음을 덮어쓴다</text>

  <circle cx="516" cy="176" r="9" fill="#E0A526"/>
  <circle cx="516" cy="176" r="17" fill="none" stroke="#8A6A12" stroke-width="1.4" stroke-dasharray="4,2"/>
  <text x="462" y="211" text-anchor="middle" font-size="9.5" font-weight="700" class="t">★멈춤</text>
  <text x="462" y="223" text-anchor="middle" font-size="7.5" class="gy">빈손으로 자를 다시 건다</text>

  <text x="516" y="248" text-anchor="middle" font-size="8" class="gy">두 자리의 방 — 다냐 세냐, 0이냐 1이냐</text>

  <text x="516" y="276" text-anchor="middle" font-size="9.5" class="ink">멈춤을 건너뛴 행동은 어디에도 안 착지한다 — 곧장 1장으로 돌아간다</text>

  <!-- ④ 분기 -->
  <circle cx="516" cy="302" r="12" fill="none" stroke="#8A6A12" stroke-width="1.2"/>
  <text x="516" y="306" text-anchor="middle" font-size="8.5" font-weight="700" class="t">분기</text>

  <path d="M 503 306 C 466 312, 442 316, 432 322" fill="none" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#mgy)"/>
  <rect x="362" y="330" width="132" height="48" rx="3" fill="none" stroke="#6a6355" stroke-width="0.7" stroke-dasharray="5,4"/>
  <text x="428" y="346" text-anchor="middle" font-size="10" font-weight="700" class="gy">비명 — 멈춤 0</text>
  <text x="428" y="359" text-anchor="middle" font-size="8" class="gy">배운 것이 하나도 안 얹힌다</text>
  <text x="428" y="372" text-anchor="middle" font-size="8" class="gy">되돌아간 자리 = 1장</text>

  <path d="M 529 306 C 566 312, 590 316, 600 322" fill="none" stroke="#8A6A12" stroke-width="2.2" marker-end="url(#mh)"/>
  <rect x="540" y="330" width="140" height="48" rx="3" fill="none" stroke="#8A6A12" stroke-width="1.6"/>
  <text x="610" y="346" text-anchor="middle" font-size="10" font-weight="700" class="t">한 박자 — 네 방 되짚기</text>
  <text x="610" y="359" text-anchor="middle" font-size="8" class="ink">원함·됨·책임·척도를 내 눈금으로</text>
  <text x="610" y="372" text-anchor="middle" font-size="8" class="ink">지어짐 × 팔림 — 0.4² 16% → 0.9² 81%</text>

  <!-- ⑤ 우측 앵커 카드 -->
  <rect x="740" y="90" width="185" height="136" rx="4" fill="none" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="111" text-anchor="middle" font-size="10.5" font-weight="700" class="t">내 자를 짓는 두 규칙</text>
  <text x="832" y="130" text-anchor="middle" font-size="8.5" class="ink">알아서 얻을 것이 알아보는 값을</text>
  <text x="832" y="143" text-anchor="middle" font-size="8.5" class="ink">확실히 웃돌기 전엔 갈래를 지우지 마라</text>
  <text x="832" y="160" text-anchor="middle" font-size="8.5" class="ink">유연하게 걸되 물러서지 않는 손</text>
  <text x="832" y="174" text-anchor="middle" font-size="8" class="gy">떠날 문을 열어 둔 채 머무는 것이 자유</text>
  <line x1="758" y1="185" x2="906" y2="185" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="201" text-anchor="middle" font-size="8.5" class="gy">반례 · 멈춤에도 값이 있다</text>
  <text x="832" y="216" text-anchor="middle" font-size="8.5" class="gy">→ 웃도는데도 멈춰 있으면 그 망설임이 빚</text>

  <!-- ⑥ 하단 결론 = 「⭐️ 네 자리」 원문 -->
  <line x1="50" y1="393" x2="910" y2="393" stroke="#d8cfbc" stroke-width="1"/>
  <text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="700" class="ink">같은 모방이라도, 멈춤 하나로 새장이 둥지가 된다</text>

  <!-- ⑦ 이월 화살 -->
  <text x="480" y="433" text-anchor="middle" font-size="9.5" class="gy">→ 이월 · "이번엔 자기가 가면을 쓰고 있다는 걸 안다" → 6장</text>
</svg>
