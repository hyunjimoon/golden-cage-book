<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    .t  { fill: #1B1B1E; }
    .ink{ fill: #2b2620; }
    .gy { fill: #6a6355; }
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>

  <!-- ① 제목줄 -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" class="t">4장 시계새장 — 폭파해</text>
  <text x="480" y="46" text-anchor="middle" font-size="10" class="gy" letter-spacing="2">합류 1+2+3 | 세면서 부숴라 | 방드르디 × 두산</text>

  <!-- ② 좌측 표제 카드 -->
  <rect x="50" y="68" width="210" height="295" rx="5" fill="none" stroke="#1B1B1E" stroke-width="2.5"/>
  <path d="M 50,68 Q 155,42 260,68" fill="none" stroke="#1B1B1E" stroke-width="2.5"/>
  <!-- 멈춘 시계 -->
  <g stroke="#1B1B1E" fill="none">
    <circle cx="155" cy="152" r="46" stroke-width="2"/>
    <circle cx="155" cy="152" r="2.5" stroke-width="2"/>
    <line x1="155" y1="152" x2="155" y2="120" stroke-width="2"/>
    <line x1="155" y1="152" x2="180" y2="164" stroke-width="2"/>
    <line x1="155" y1="106" x2="155" y2="112" stroke-width="1.6"/>
    <line x1="201" y1="152" x2="195" y2="152" stroke-width="1.6"/>
    <line x1="155" y1="198" x2="155" y2="192" stroke-width="1.6"/>
    <line x1="109" y1="152" x2="115" y2="152" stroke-width="1.6"/>
    <!-- 금 -->
    <path d="M 124 118 L 141 140 L 128 150 L 149 176 L 137 190" stroke-width="1.2" stroke-dasharray="3,2"/>
  </g>
  <text x="155" y="234" text-anchor="middle" font-size="15" font-weight="700" class="t" letter-spacing="3">시계 새장</text>
  <text x="155" y="256" text-anchor="middle" font-size="10.5" class="ink">잘 돌수록, 시계 없는 삶을 못 그린다</text>
  <text x="155" y="286" text-anchor="middle" font-size="9" class="gy">로빈슨 — 30년의 질서가 몇 초 만에</text>
  <text x="155" y="301" text-anchor="middle" font-size="9" class="gy">두산 130년 — 다섯 번 이상 자기를 태웠다</text>
  <text x="155" y="338" text-anchor="middle" font-size="10" class="t" font-style="italic">"내가 만든 것이 나를</text>
  <text x="155" y="351" text-anchor="middle" font-size="10" class="t" font-style="italic">가두고 있지 않은가?"</text>

  <line x1="300" y1="58" x2="300" y2="395" stroke="#d8cfbc" stroke-width="1"/>

  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B1B1E"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6355"/>
    </marker>
  </defs>

  <!-- ③ 중앙 개념도 — 세 장이 합쳐져 질서가 되고, 질서가 변이를 죽인다 -->
  <text x="352" y="96" font-size="8" class="gy">쌓이는 것</text>
  <text x="392" y="118" text-anchor="end" font-size="9" class="ink">1장 도취</text>
  <text x="392" y="146" text-anchor="end" font-size="9" class="ink">2장 관조</text>
  <text x="392" y="174" text-anchor="end" font-size="9" class="ink">3장 확신</text>
  <path d="M 400 115 C 430 118, 448 132, 468 142" fill="none" stroke="#1B1B1E" stroke-width="1.2" marker-end="url(#ak)"/>
  <path d="M 400 143 L 468 145" fill="none" stroke="#1B1B1E" stroke-width="1.2" marker-end="url(#ak)"/>
  <path d="M 400 171 C 430 168, 448 156, 468 148" fill="none" stroke="#1B1B1E" stroke-width="1.2" marker-end="url(#ak)"/>

  <rect x="474" y="126" width="86" height="40" rx="3" fill="none" stroke="#1B1B1E" stroke-width="2"/>
  <text x="517" y="143" text-anchor="middle" font-size="10.5" font-weight="700" class="t">질서</text>
  <text x="517" y="157" text-anchor="middle" font-size="8" class="gy">성공한 질서</text>

  <line x1="562" y1="146" x2="612" y2="146" stroke="#1B1B1E" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="587" y="139" text-anchor="middle" font-size="7.5" class="gy">인공선택</text>

  <rect x="616" y="126" width="82" height="40" rx="3" fill="none" stroke="#6a6355" stroke-width="0.8" stroke-dasharray="5,4"/>
  <text x="657" y="143" text-anchor="middle" font-size="10" font-weight="700" class="gy">변이 사멸</text>
  <text x="657" y="157" text-anchor="middle" font-size="8" class="gy">고를 재료가 없다</text>

  <!-- 빚의 원천 상승 -->
  <text x="352" y="204" font-size="8" class="gy">빚의 원천이 올라간다</text>
  <g stroke="#1B1B1E" stroke-width="1">
    <line x1="396" y1="228" x2="428" y2="228"/>
    <line x1="446" y1="222" x2="478" y2="222"/>
    <line x1="496" y1="216" x2="528" y2="216"/>
    <line x1="546" y1="210" x2="578" y2="210"/>
  </g>
  <text x="412" y="240" text-anchor="middle" font-size="8" class="gy">남의 욕망</text>
  <text x="462" y="234" text-anchor="middle" font-size="8" class="gy">남의 렌즈</text>
  <text x="512" y="228" text-anchor="middle" font-size="8" class="gy">내 확신</text>
  <text x="562" y="222" text-anchor="middle" font-size="8" font-weight="700" class="ink">내 성공</text>
  <text x="640" y="222" text-anchor="middle" font-size="8" class="gy">← 가장 단단한 창살</text>

  <text x="516" y="266" text-anchor="middle" font-size="9.5" class="ink">성공이 변이를 죽이면, 그 성공이 빚이 된다</text>

  <!-- ④ 분기 — 세 갈래 -->
  <circle cx="512" cy="292" r="12" fill="none" stroke="#1B1B1E" stroke-width="1.2"/>
  <text x="512" y="296" text-anchor="middle" font-size="8.5" font-weight="700" class="t">분기</text>

  <path d="M 500 296 C 452 306, 400 312, 384 324" fill="none" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#agy)"/>
  <rect x="330" y="332" width="108" height="46" rx="3" fill="none" stroke="#6a6355" stroke-width="0.7" stroke-dasharray="5,4"/>
  <text x="384" y="348" text-anchor="middle" font-size="9.5" font-weight="700" class="gy">무모</text>
  <text x="384" y="361" text-anchor="middle" font-size="7.5" class="gy">비용에 눈감고 부순다</text>
  <text x="384" y="373" text-anchor="middle" font-size="7.5" class="gy">= 1장</text>

  <path d="M 510 305 L 502 325" fill="none" stroke="#6a6355" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#agy)"/>
  <rect x="446" y="332" width="108" height="46" rx="3" fill="none" stroke="#6a6355" stroke-width="0.7" stroke-dasharray="5,4"/>
  <text x="500" y="348" text-anchor="middle" font-size="9.5" font-weight="700" class="gy">냉소</text>
  <text x="500" y="361" text-anchor="middle" font-size="7.5" class="gy">비용이 무서워 못 부순다</text>
  <text x="500" y="373" text-anchor="middle" font-size="7.5" class="gy">= 2장</text>

  <path d="M 524 296 C 570 306, 604 312, 618 324" fill="none" stroke="#1B1B1E" stroke-width="2.2" marker-end="url(#ak)"/>
  <rect x="562" y="332" width="140" height="46" rx="3" fill="#1B1B1E" fill-opacity="0.05" stroke="#1B1B1E" stroke-width="1.6"/>
  <text x="632" y="348" text-anchor="middle" font-size="9.5" font-weight="700" class="t">세면서 부순다</text>
  <text x="632" y="361" text-anchor="middle" font-size="7.5" class="ink">담뱃대 셋 — 한 달에 이틀 · 수입 5% · 주 1회</text>
  <text x="632" y="373" text-anchor="middle" font-size="7.5" class="ink">부수기 전에 네 '텐'을 먼저 센다</text>

  <!-- ⑤ 우측 앵커 카드 -->
  <rect x="740" y="90" width="185" height="122" rx="4" fill="none" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="111" text-anchor="middle" font-size="10.5" font-weight="700" class="t">감금과 헌신을 갈라라</text>
  <text x="832" y="130" text-anchor="middle" font-size="8.5" class="ink">모키어 — 인공선택은 단기 효율이 압승</text>
  <text x="832" y="145" text-anchor="middle" font-size="8.5" class="ink">환경이 바뀌면 변이 없는 쪽이 먼저 무너진다</text>
  <text x="832" y="160" text-anchor="middle" font-size="8.5" class="gy">옵션 없는 헌신은 감금, 있는 헌신만 자유</text>
  <line x1="758" y1="171" x2="906" y2="171" stroke="#d8cfbc" stroke-width="1"/>
  <text x="832" y="187" text-anchor="middle" font-size="8.5" class="gy">반례 · 시계가 없었으면 미쳐 죽었다</text>
  <text x="832" y="202" text-anchor="middle" font-size="8.5" class="gy">→ 빌린 질서가 먼저 그를 살렸다</text>

  <!-- ⑥ 하단 결론 = 「⭐️ 네 자리」 원문 -->
  <line x1="50" y1="393" x2="910" y2="393" stroke="#d8cfbc" stroke-width="1"/>
  <text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="700" class="ink">세면서 부수는 손만 가볍다</text>

  <!-- ⑦ 이월 화살 -->
  <text x="480" y="433" text-anchor="middle" font-size="9.5" class="gy">→ 이월 · "빈 자리에서 거울을 들면, 일이 거꾸로 묻는다" → 5장</text>
</svg>
