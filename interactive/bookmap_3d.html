<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 지도 — 사면체 안의 거꾸로 사면체</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=Noto+Serif+KR:wght@700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans KR',sans-serif;background:#090c15;color:#e8eaf0;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 24px 48px;}
  .back{display:inline-block;font-size:12px;color:#5a6a7a;text-decoration:none;margin-bottom:18px;transition:color 0.15s;}
  .back:hover{color:#e8eaf0;}
  .head{text-align:center;max-width:680px;margin:0 auto 6px;}
  .kicker{font-size:11px;letter-spacing:4px;color:#4A7A6B;font-weight:700;margin-bottom:12px;}
  .head h1{font-size:1.5em;font-weight:700;letter-spacing:-0.5px;margin-bottom:14px;line-height:1.4;}
  .head p{font-size:13px;color:#8899aa;line-height:1.95;}
  .head p b{color:#d6dce6;font-weight:600;}
  .svg{width:100%;height:auto;display:block;margin:2px auto 0;}
  .svg a{cursor:pointer;}
  .svg a:hover circle{stroke:#fff;stroke-width:2.5;}
  .svg a:hover text{fill:#fff !important;}
  .foot{text-align:center;font-size:11px;color:#5a6a7a;margin-top:4px;line-height:1.9;}
  .foot a{color:#4A7A6B;text-decoration:none;}
  .foot a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 표지 · 평면 지도로</a>
  <div class="head">
    <div class="kicker">THE MAP · 3D 체험판</div>
    <h1>새장 사면체 안에, 둥지 사면체가 거꾸로 맞물린다</h1>
    <p>같은 골격이 감옥에서 둥지로. <b>자기 새장은 자기에게 잘 안 보인다</b> — 깊이를 돌려가며 보면 안쪽 사면체가 드러난다. 정본 평면 지도는 <a href="../index.html" style="color:#8ab6d6;text-decoration:none;">표지</a>에.</p>
  </div>
  <svg id="bookmap-svg" class="svg" viewBox="0 0 1120 1000" role="img" aria-label="황금새장을열다 책 지도 — 사면체 안의 거꾸로 사면체"></svg>
  <div class="foot">노드를 누르면 그 장으로 항해 → · 같은 색 = 거울쌍(한 글자 비틂) · 중심 &#9733; = 5&#8596;10 회전축(101&#8322;&#8596;101&#8323;)</div>
</div>
<script>
(function(){
  const U={bit:'#4a90d9',atom:'#3aa86a',cell:'#d24b3a',second:'#d9a92e'};
  const SL={1:'ch1_mirror_cage',2:'ch2_telescope_cage',3:'ch3_glass_cage',4:'ch4_clock_cage',6:'ch6_butterfly_nest',7:'ch7_tulip_nest',8:'ch8_mist_nest',9:'ch9_raven_nest'};
  const S=205, CX=560, CY=480, B=Math.PI/6, A=26*Math.PI/180, cos=Math.cos, sin=Math.sin;
  const proj=c=>{const[x,y,z]=c; const x1=x*cos(B)+z*sin(B), z1=-x*sin(B)+z*cos(B), y1=y;
    const y2=y1*cos(A)-z1*sin(A), z2=y1*sin(A)+z1*cos(A); return {x:CX+x1*S, y:CY-y2*S, d:z2};};
  const V=[
    {c:[1,1,1],n:1,g:'cage',u:'bit',nm:'거울새장',kw:'욕망',slo:'장부를 펴라',nov:'마담 보바리'},
    {c:[1,-1,-1],n:2,g:'cage',u:'atom',nm:'망원경새장',kw:'계산',slo:'순서를 타라',nov:'표범'},
    {c:[-1,1,-1],n:3,g:'cage',u:'cell',nm:'스테인드글라스',kw:'책임',slo:'확신을 교정하라',nov:'페스트'},
    {c:[-1,-1,1],n:4,g:'cage',u:'second',nm:'시계새장',kw:'질서',slo:'다음 불을 피워라',nov:'방드르디'},
    {c:[-1,-1,-1],n:6,g:'nest',u:'bit',nm:'나비둥지',kw:'사용자',slo:'역할을 입어라',nov:'M.Butterfly'},
    {c:[-1,1,1],n:8,g:'nest',u:'atom',nm:'안개둥지',kw:'투자자',slo:'선을 넘어라',nov:'안개'},
    {c:[1,-1,1],n:7,g:'nest',u:'cell',nm:'튤립둥지',kw:'기술',slo:'확률적으로 생각하라',nov:'검은 튤립'},
    {c:[1,1,-1],n:9,g:'nest',u:'second',nm:'까마귀둥지',kw:'협력자',slo:'의미를 만들어라',nov:'삼국유사'},
  ];
  V.forEach(v=>{const p=proj(v.c);v.x=p.x;v.y=p.y;v.d=p.d;});
  const dmin=Math.min(...V.map(v=>v.d)), dmax=Math.max(...V.map(v=>v.d)), norm=d=>(d-dmin)/(dmax-dmin||1);
  const diff=(a,b)=>{let n=0;for(let i=0;i<3;i++)if(a.c[i]!==b.c[i])n++;return n;};
  let E=[]; for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const a=V[i],b=V[j];E.push({a,b,k:diff(a,b),dep:(norm(a.d)+norm(b.d))/2});}
  const ln=(a,b,at)=>`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" ${at}/>`;
  let s='';
  E.filter(e=>e.k===1).forEach(e=>{s+=ln(e.a,e.b,`stroke="#8aa0c0" stroke-width="1" opacity="${(0.08+0.16*e.dep).toFixed(2)}"`);});
  E.filter(e=>e.k===3).forEach(e=>{s+=ln(e.a,e.b,`stroke="${U[e.a.u]}" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.45"`);});
  E.filter(e=>e.k===2 && e.a.g===e.b.g).forEach(e=>{const o=(0.32+0.5*e.dep).toFixed(2);
    if(e.a.g==='cage') s+=ln(e.a,e.b,`stroke="#cbb487" stroke-width="${(1.5+1.6*e.dep).toFixed(1)}" opacity="${o}"`);
    else s+=ln(e.a,e.b,`stroke="#8ab6d6" stroke-width="${(1.3+1.1*e.dep).toFixed(1)}" stroke-dasharray="7 5" opacity="${o}"`);});
  // hub (clickable -> ch5)
  s+=`<a href="reader.html?file=ch5_mirror_nest">`;
  s+=`<circle cx="${CX}" cy="${CY}" r="30" fill="#0a0a0a" stroke="#d4af37" stroke-width="1.2" opacity="0.9"/>`;
  s+=`<text x="${CX}" y="${CY-5}" text-anchor="middle" fill="#d4af37" font-size="18" font-family="serif">&#9733;</text>`;
  s+=`<text x="${CX}" y="${CY+12}" text-anchor="middle" fill="#d4af37" font-size="10.5">5&#8596;10 회전축</text>`;
  s+=`<text x="${CX}" y="${CY+25}" text-anchor="middle" fill="#9a8a4a" font-size="9.5">101&#8322;&#8596;101&#8323;</text></a>`;
  [...V].sort((p,q)=>p.d-q.d).forEach(v=>{const col=U[v.u], f=norm(v.d), r=(7+4.5*f).toFixed(1), op=(0.5+0.5*f).toFixed(2);
    let dx=v.x-CX, dy=v.y-CY, L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
    const gap=44+Math.max(0,150-L)*0.55, lx=v.x+dx*gap, ly=v.y+dy*gap, anc=dx>0.25?'start':(dx<-0.25?'end':'middle');
    s+=`<a href="reader.html?file=${SL[v.n]}">`;
    s+=`<circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="${r}" fill="${col}" stroke="#090c15" stroke-width="2" opacity="${op}"/>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly-6).toFixed(1)}" text-anchor="${anc}" font-family="'Noto Serif KR',serif" font-weight="700" font-size="15" fill="${col}">${v.n} ${v.nm}</text>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+11).toFixed(1)}" text-anchor="${anc}" font-size="12" fill="#cfd6e0">${v.kw} &#183; &#12300;${v.slo}&#12301;</text>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+27).toFixed(1)}" text-anchor="${anc}" font-size="10.5" fill="#7c8aa8">${v.nov} &#183; [${v.u}]</text></a>`;});
  document.getElementById('bookmap-svg').innerHTML=s;
})();
</script>
</body>
</html>
