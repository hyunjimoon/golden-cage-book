name: seat-label
# 이슈 폼의 「장 · 자리」 답을 라벨로 옮기고, 비어 있으면 한 줄 알린다.
# 템플릿은 UI로 만든 이슈만 잡는다 — `gh issue create` 로 만든 것도 잡으려면 이 알림이 필요하다.
# 🚫 막지 않는다. 라벨을 붙이거나, 없다고 말할 뿐이다.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write
  contents: read

jobs:
  seat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const CHAP = [
              ["1장",  "🪞1장-거울"],        ["2장",  "🔭2장-망원경"],
              ["3장",  "💒3장-스테인굴레스"], ["4장",  "⏱️4장-시계"],
              ["5장",  "🐀5장-101호"],       ["6장",  "🦋6장-나비"],
              ["7장",  "🧅7장-튤립구근"],     ["8장",  "🌫️8장-안개"],
              ["9장",  "🐦‍⬛9장-까마귀"],     ["10장", "⭐️10장-투향"],
              // 「전반」도 **고른 답**이다 — 라벨이 없으면 안 적은 것과 구별되지 않는다.
              ["전반", "🌐전반"],
            ];
            const SEAT = [
              ["👁️", "👁️눈-관찰"], ["🧠", "🧠뇌-이유"],
              ["🫀", "🫀심장-방법"], ["🤚", "🤚손-실행"],
            ];

            const issue = context.payload.issue;
            const body  = issue.body || "";
            const have  = new Set((issue.labels || []).map(l => typeof l === "string" ? l : l.name));

            // 이슈 폼은 `### <물음>\n\n<고른 값>` 꼴로 렌더된다. 그 절(section)만 읽는다.
            const section = (head) => {
              const m = body.match(new RegExp(`^###\\s*${head}[^\\n]*\\n+([^\\n]+)`, "m"));
              return m ? m[1].trim() : "";
            };
            const chapAns = section("장");
            const seatAns = section("자리");

            const add = [];
            const hasChap = CHAP.some(([, l]) => have.has(l));
            const hasSeat = SEAT.some(([, l]) => have.has(l));

            if (!hasChap && chapAns) {
              // "10장"이 "1장"에 먼저 걸리지 않도록 긴 것부터 본다.
              const hit = [...CHAP].sort((a, b) => b[0].length - a[0].length)
                                   .find(([k]) => chapAns.startsWith(k));
              if (hit) add.push(hit[1]);
            }
            if (!hasSeat && seatAns) {
              const hit = SEAT.find(([k]) => seatAns.includes(k));
              if (hit) add.push(hit[1]);
            }
            if (add.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: add });
              core.info(`붙임: ${add.join(", ")}`);
            }

            // 알림은 두 줄만. 라벨이 차면 봇이 제 댓글을 지운다 — 기록에도 안 쌓이게.
            const MARK = "<!-- seat-label -->";
            const nowChap = hasChap || add.some(l => CHAP.some(([, c]) => c === l));
            const nowSeat = hasSeat || add.some(l => SEAT.some(([, s]) => s === l));

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, per_page: 100 });
            // 표식이 없던 옛 알림도 같이 잡아 치운다.
            const mine = comments.data.find(c => c.user.type === "Bot"
              && ((c.body || "").startsWith(MARK) || (c.body || "").includes("「전반 × 미분류」")));

            if (nowChap && nowSeat) {
              if (mine) await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id });
              return;
            }
            if (mine) return;   // 이미 적어 뒀다. 고칠 때마다 쌓지 않는다.

            // ⚠️ 🤚(내가 겪은 것)와 🖐(남이 겪은 것)는 **의도된 구별**이다 — 통일하지 마라(룰링 2026-11-01).
            //    경험과 사례는 같은 짝(🫀+손)에 일부러 함께 앉고, 안↔밖을 나르는 건 손의 글자다.
            //    손을 라벨로 쓸 날에는 위 SEAT 매처가 두 글자를 다 받아야 한다 (지금은 🤚 하나만 본다).
            const miss = !nowChap && !nowSeat ? "장·자리가" : (!nowChap ? "장이" : "자리가");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `${MARK}\n`
                  + `🏷️ **${miss} 비었습니다** — 지도의 「전반 × 미분류」 칸에 쌓입니다.\n`
                  + `👁️ 눈·봤나 · 🧠 뇌·궁리했나 · 🫀 심장·뛰었나 · 🤚 손·움직였나 ｜ 🫀🤚경험 · 👁️🧠지식 · 🫀🖐사례` });
