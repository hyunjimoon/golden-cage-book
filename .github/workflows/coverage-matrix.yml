name: coverage-matrix

# 투향 최소충분통계 — 「무엇이 비었나」 한 장을 굽는다.
# 2026-11-25 이전에는 장×렌즈 이슈 수를 셌고, 찾던 렌즈 라벨 넷이
# 기관 넷으로 개명돼 마흔 칸이 매일 비었다(이슈 #183).
# 자를 이슈에서 지면으로 옮긴다 — 이슈 수는 말이 있나를 재고
# 지면이 비었나를 못 잰다.

on:
  push:
    branches: [main]
    paths:
      - "chapters/**"
      - "scripts/12_bincan.py"
      - ".github/workflows/coverage-matrix.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: coverage-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 자를 아는 값에 먼저 대 본다
        run: |
          set -euo pipefail
          out=$(python3 -I scripts/12_bincan.py chapters --selftest)
          echo "$out"
          full=$(echo "$out" | sed -n 's/^FULL=\([0-9]*\).*/\1/p')
          # 2026-11-25 실측 하한. 원고가 채워지면 올라간다 — 내려가면 자가 깨진 것이다.
          if [ -z "$full" ] || [ "$full" -lt 8 ]; then
            echo "::error::네 절을 다 가진 장이 ${full:-?} 개다. 하한 8 아래면 자가 깨졌다 — 표를 굽지 않는다"
            exit 1
          fi

      - name: 굽는다
        run: |
          set -euo pipefail
          mkdir -p docs
          python3 -I scripts/12_bincan.py chapters > docs/coverage.md
          head -6 docs/coverage.md

      - name: 바뀌었으면 커밋
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain docs/coverage.md)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git add docs/coverage.md
          git commit -m "chore: 빈칸 표 자동 갱신 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt rejected — retrying"
            sleep 3
          done
          echo "push failed after retries" && exit 1
