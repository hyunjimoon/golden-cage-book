name: Radio Transcript Automation

on:
  workflow_dispatch:
    inputs:
      episode_url:
        description: 'Podcast episode URL'
        required: true
        type: string
      output_path:
        description: 'Output markdown path (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract transcript
        env:
          EPISODE_URL: ${{ inputs.episode_url }}
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          if [ -n "$OUTPUT_PATH" ]; then
            python scripts/radio_transcript.py "$EPISODE_URL" --output "$OUTPUT_PATH"
          else
            python scripts/radio_transcript.py "$EPISODE_URL"
          fi

      - name: Commit transcript file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No transcript changes"
            exit 0
          fi
          git commit -m "auto: 라디오 transcript 추가 — $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "All push attempts failed"
          exit 1
