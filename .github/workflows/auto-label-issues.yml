name: Auto-label issues

# 새 이슈(또는 제목 수정) 시 제목의 챕터 이모지·소설/인물 키워드·4렌즈 키워드를 읽어 라벨 자동부착.
# 설계도(3차소통) 거울쌍 격자 기준. 라벨은 addLabels라 idempotent — 재실행/edit 안전.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            const has = (s) => title.includes(s);
            const toAdd = new Set();

            // 챕터: 이모지(소품) OR 소설/인물 키워드
            const chapters = [
              ["🪞1장-보바리",   ["🪞"],            /보바리|엠마|거울새장/],
              ["🔭2장-표범",     ["🔭"],            /표범|살리나|망원경|탄크레디|콘체타/],
              ["💒3장-페스트",   ["💒"],            /페스트|파늘루|리외|스테인드글라스/],
              ["⏱️4장-방드르디", ["⏱️", "⏱"],       /방드르디|로빈슨|시계새장|투르니에/],
              ["🐀5장-1984",     ["🐀"],            /101호|1984|윈스턴|빅브라더|오브라이언/],
              ["🦋6장-나비부인", ["🦋"],            /나비부인|송릴링|송 릴링|버터플라이/],
              ["🌷7장-검은튤립", ["🌷"],            /검은튤립|검은 튤립|코르넬리우스|튤립/],
              ["🌫️8장-안개",    ["🌫️", "🌫"],      /안개|니에블라|niebla|아우구스토|우나무노/i],
              ["🐦‍⬛9장-까마귀", ["🐦‍⬛", "🐦"],      /까마귀|raven|삼국유사|일연/i],
            ];
            for (const [label, emojis, kw] of chapters) {
              if (emojis.some((e) => has(e)) || kw.test(title)) toAdd.add(label);
            }

            // 4렌즈: 우선순위 첫 매치 하나만
            const lens = [
              ["자료-재료",   /📚|발췌|영상|유튜브|youtube|자료|인터뷰|레퍼런스|사례|월드컵|팔로우업|결산|목록|독후|시전|스냅샷|기록/i],
              ["어떻게-도구", /도구|프로토콜|비유|작법|실험|다이어그램|구조|정렬|repurpos|재목적|모델|알고리즘|템플릿|계층|미시구조|공식/i],
              ["왜-방향",     /이유|가치|독자|비전|윤리|철학|마음|사랑|예의|정의|겸손|왜 창업|보편/],
              ["무엇-빚",     /빚|품질|본문|교정|퇴고|고통|다이어트/],
            ];
            for (const [label, re] of lens) {
              if (re.test(title)) { toAdd.add(label); break; }
            }

            if (toAdd.size === 0) {
              core.info("매칭 라벨 없음 — 수동 부착 대상");
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [...toAdd],
            });
            core.info("부착: " + [...toAdd].join(", "));
