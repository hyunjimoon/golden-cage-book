name: 이슈 — 어느 장, 어느 자리
description: 장과 자리를 고르고 연다. 둘 다 적혀야 지도 위 한 칸이 선다.
body:
  - type: markdown
    attributes:
      value: |
        네 자리는 몸의 순서다 — **눈으로 보고 · 뇌로 궁리하고 · 심장이 뛰고 · 손이 움직인다.**

  - type: dropdown
    id: chapter
    attributes:
      label: 장 — 어디 것인가
      options:
        - 1장 거울 (마담 보바리)
        - 2장 망원경 (표범)
        - 3장 스테인굴레스 (페스트)
        - 4장 시계 (방드르디)
        - 5장 101호 (1984)
        - 6장 나비 (M. Butterfly)
        - 7장 튤립구근 (검은 튤립)
        - 8장 안개 (안개)
        - 9장 까마귀 (삼국유사·Raven)
        - 10장 투향 (101₃호)
        - 전반 — 한 장에 안 묶인다
    validations:
      required: true

  - type: dropdown
    id: seat
    attributes:
      label: 자리 — 무엇에 관한 글인가
      options:
        - 👁️ 눈 — 무엇을 봤나 (사실·자료·레퍼런스·실측)
        - 🧠 뇌 — 무엇을 궁리했나 (왜·방향·가치)
        - 🫀 심장 — 무엇이 뛰었나 (어떻게·도구·실험)
        - 🤚 손 — 무엇이 움직였나 (그래서·남는 것·실천)
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: 내용
      description: 역설로 열고, 숫자나 표 하나로 받치고, 한 줄로 닫는다.
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: 도움
      options:
        - label: 외부 의견을 환영합니다
          required: false
