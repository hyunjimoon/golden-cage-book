<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <!-- 10장 배너 · 개고 2026-11-25 🟡5res
       CSS 변수 금지 (00_geo 평면도가 그 병에 걸려 있다, 158건 → 밖에서 통째로 까맣다).
       적는 말은 전부 10장 원고에 있는 말이다 (2026-11-25 실측 · 코퍼스 4차소통/원고/*.md 16파일).
         뺀 것 — 1,024개의 커밋 · 303 · 74 · 대폭발 · 침체 · 설득분자 · 넷은 넷 (전부 책 전체 0건)
                 · 적분 · Fubini · 호러 · 판타지 (10장 0건)
         넣은 것 — 101 7 · 실 7 · 세다 5 · 문패 4 · 매듭 4 · 제본선 2 · 일기장 2 · 오브라이언 1
       자를 양쪽으로 돌렸다 (🟢4sec 2026-11-25) — 판에 없는 것을 그렸나 + 원고에 선 것을 빼먹었나.
         뒤쪽에서 걸린 것이 전부였다 — 실·매듭·제본선·문패가 옛 판에 0건이었다.
       짝 5장과 점 반전. 같은 자리에 뒤집힌 말이 선다 — 「같이 가 세」↔「같이 세 세」 (한 글자). -->
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    .t  { fill: #8A6A12; }  .ink{ fill: #2b2620; }  .gy { fill: #6a6355; }
    .d  { fill: #2D5FA8; }  .b  { fill: #B0821F; }  .a  { fill: #C8102E; }
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>

  <!-- 제목줄 -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" class="t">10장 101₃호 — 발현</text>
  <text x="480" y="46" text-anchor="middle" font-size="10" class="gy" letter-spacing="2">이음새 | 빚을 갚는다 | 세 자리가 둘로 돌아가는 방</text>
  <g>
    <rect x="806" y="16" width="130" height="20" rx="10" fill="#FFD53A" opacity="0.18"/>
    <rect x="806" y="16" width="130" height="20" rx="10" fill="none" stroke="#FFD53A" stroke-width="1" opacity="0.55"/>
    <text x="818" y="30" font-size="9" class="gy" letter-spacing="1">5 ↔ 10</text>
    <text x="924" y="30" text-anchor="end" font-size="10" font-weight="700" class="ink">지른 나, 막는 나</text>
  </g>

  <!-- 받는 쪽 한 줄 (🟣2atom 꼴 2026-11-25) — 열 판이 주는 쪽만 그리고 있었다.
       10장은 세다 장치가 아니라 저자 서술로 받는다 — 10장 :50·:58·:62·:80·:102 다섯 자리. -->
  <text x="300" y="64" font-size="9" class="gy">← 5장에서 받는다 · <tspan font-style="italic">"두 방은 같은 도면 위에 서 있다 — 바뀐 것은 방향 하나"</tspan></text>

  <!-- 좌측 방 카드 — 5장 카드의 점 반전 -->
  <rect x="44" y="68" width="206" height="300" rx="5" fill="none" stroke="#8A6A12" stroke-width="2.5"/>
  <path d="M 44,68 Q 147,42 250,68" fill="none" stroke="#8A6A12" stroke-width="2.5"/>
  <g stroke="#8A6A12" fill="none">
    <line x1="147" y1="84" x2="147" y2="112" stroke-width="1.4"/>
    <path d="M 131 126 L 163 126 L 156 112 L 138 112 Z" stroke-width="1.6"/>
    <circle cx="147" cy="133" r="5.5" fill="#E0A526" stroke="none"/>
    <g stroke="#E0A526" stroke-width="1.1">
      <line x1="147" y1="142" x2="147" y2="149"/><line x1="156" y1="133" x2="163" y2="133"/>
      <line x1="131" y1="133" x2="138" y2="133"/><line x1="154" y1="140" x2="159" y2="145"/>
      <line x1="140" y1="140" x2="135" y2="145"/>
    </g>
  </g>
  <!-- 5장은 유리 뒤쪽, 10장은 실 안쪽 -->
  <g stroke="#C8102E" fill="none" stroke-width="1.3">
    <path d="M 100 172 Q 124 160 147 172 Q 170 184 194 172"/>
    <path d="M 100 196 Q 124 208 147 196 Q 170 184 194 196"/>
  </g>
  <text x="147" y="216" text-anchor="middle" font-size="8.5" class="gy">실 안쪽에서 목소리가 난다</text>
  <text x="147" y="252" text-anchor="middle" font-size="16" font-weight="700" class="t" letter-spacing="2">101₃호</text>
  <text x="147" y="273" text-anchor="middle" font-size="10.5" class="ink">빚을 갚는 방 — 뜨겁게</text>
  <line x1="74" y1="288" x2="220" y2="288" stroke="#8A6A12" stroke-width="0.6" opacity="0.4"/>
  <text x="147" y="310" text-anchor="middle" font-size="9.5" class="ink" font-style="italic">"나에게 하세요.</text>
  <text x="147" y="326" text-anchor="middle" font-size="9.5" class="ink" font-style="italic">다 말고, 나에게.</text>
  <text x="147" y="342" text-anchor="middle" font-size="9.5" class="ink" font-style="italic">같이 세 세."</text>
  <text x="147" y="358" text-anchor="middle" font-size="8" class="gy">— 세 · 5장 이후 처음 듣는 목소리</text>

  <!-- 가운데 — 자리가 셋에서 둘로 -->
  <text x="300" y="92" font-size="10" font-weight="700" class="gy" letter-spacing="1">자리가 셋이다 — 문패에 한 자리가 늘었다</text>
  <g stroke="#8A6A12" fill="none" stroke-width="1.8">
    <rect x="300" y="106" width="58" height="56" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="365" y="106" width="58" height="56" rx="3" fill="#FFD53A" fill-opacity="0.14"/>
    <rect x="430" y="106" width="58" height="56" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>
  <text x="329" y="132" text-anchor="middle" font-size="15" font-weight="700" class="d">다</text>
  <text x="329" y="151" text-anchor="middle" font-size="8" class="gy">원함</text>
  <text x="394" y="132" text-anchor="middle" font-size="15" font-weight="700" class="t">세다</text>
  <text x="394" y="151" text-anchor="middle" font-size="8" class="gy">대신 센다</text>
  <text x="459" y="132" text-anchor="middle" font-size="15" font-weight="700" class="t">세</text>
  <text x="459" y="151" text-anchor="middle" font-size="8" class="gy">믿음</text>

  <!-- 찢는다 — 5장의 「쏜다」와 같은 자리 -->
  <defs><marker id="ah10" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#C8102E"/></marker></defs>
  <path d="M 394 168 L 394 190" stroke="#C8102E" stroke-width="2" fill="none" marker-end="url(#ah10)"/>
  <text x="408" y="186" font-size="9.5" font-weight="700" class="a">다가 세다를 찢는다</text>
  <text x="300" y="214" font-size="8.5" class="gy">세다가 내민 손을 거둔다 — 둘이 스스로 세면 사라진다</text>

  <!-- 두 자리로 돌아간다 -->
  <g stroke="#8A6A12" fill="none" stroke-width="1.8">
    <rect x="316" y="228" width="72" height="48" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="400" y="228" width="72" height="48" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>
  <text x="352" y="252" text-anchor="middle" font-size="14" font-weight="700" class="d">다</text>
  <text x="436" y="252" text-anchor="middle" font-size="14" font-weight="700" class="t">세</text>
  <text x="394" y="292" text-anchor="middle" font-size="9" font-weight="700" class="t">둘이 직접 센다</text>
  <text x="300" y="314" font-size="9" class="ink">다가 세의 손가락을 세고, 세가 다의 손가락을 센다.</text>
  <text x="300" y="330" font-size="9" class="ink"><tspan font-weight="700">두 번 세어야 넷이 넷이 된다.</tspan></text>

  <!-- 우측 — 매듭 셋 -->
  <rect x="520" y="86" width="180" height="222" rx="5" fill="#FFFFFF" opacity="0.4"/>
  <rect x="520" y="86" width="180" height="222" rx="5" fill="none" stroke="#8A6A12" stroke-width="1" opacity="0.5"/>
  <text x="610" y="110" text-anchor="middle" font-size="11" font-weight="700" class="t">매듭이 셋이다</text>
  <line x1="542" y1="120" x2="678" y2="120" stroke="#8A6A12" stroke-width="0.6" opacity="0.4"/>
  <circle cx="542" cy="142" r="5" fill="none" stroke="#8A6A12" stroke-width="1.4"/>
  <text x="556" y="140" font-size="8.8" class="ink" font-style="italic">꿈꾸던 자유가, 굴레를</text>
  <text x="556" y="152" font-size="8.8" class="ink" font-style="italic">사랑하는 예속이었나</text>
  <circle cx="542" cy="178" r="5" fill="none" stroke="#8A6A12" stroke-width="1.4"/>
  <text x="556" y="176" font-size="8.8" class="ink" font-style="italic">못 박아 배신할 수 없는</text>
  <text x="556" y="188" font-size="8.8" class="ink" font-style="italic">이론은, 이미 죽은 세계인가</text>
  <circle cx="542" cy="214" r="5" fill="#C8102E" fill-opacity="0.18" stroke="#C8102E" stroke-width="1.6"/>
  <text x="556" y="212" font-size="8.8" class="a" font-style="italic">세를 쏜 다를 이해하는</text>
  <text x="556" y="224" font-size="8.8" class="a" font-style="italic">것이, 다시 태어나는 일인가</text>
  <line x1="542" y1="240" x2="678" y2="240" stroke="#8A6A12" stroke-width="0.6" opacity="0.4"/>
  <text x="610" y="258" text-anchor="middle" font-size="8.5" class="gy">앞의 둘은 지나온 방이 답을 두고 왔다.</text>
  <text x="610" y="272" text-anchor="middle" font-size="8.5" font-weight="700" class="a">셋째에는 두고 온 것이 없다.</text>
  <text x="610" y="294" text-anchor="middle" font-size="8.5" class="gy">— 그 자리는 읽는 사람이 채운다</text>

  <!-- 들고 나온 것을 연다 -->
  <rect x="722" y="86" width="196" height="222" rx="5" fill="none" stroke="#8A6A12" stroke-width="1" opacity="0.5"/>
  <text x="820" y="110" text-anchor="middle" font-size="11" font-weight="700" class="t">5장에서 들고 나온 것</text>
  <line x1="744" y1="120" x2="896" y2="120" stroke="#8A6A12" stroke-width="0.6" opacity="0.4"/>
  <g transform="translate(790,136)">
    <rect x="0" y="0" width="60" height="44" rx="2" fill="#C8102E" fill-opacity="0.16" stroke="#C8102E" stroke-width="1.4"/>
    <line x1="30" y1="-4" x2="30" y2="48" stroke="#8A6A12" stroke-width="1.6"/>
    <path d="M 22 6 Q 30 10 38 6" fill="none" stroke="#8A6A12" stroke-width="1.1"/>
    <path d="M 22 40 Q 30 44 38 40" fill="none" stroke="#8A6A12" stroke-width="1.1"/>
  </g>
  <text x="820" y="198" text-anchor="middle" font-size="10" font-weight="700" class="ink">붉은 일기장 · 제본선</text>
  <text x="820" y="216" text-anchor="middle" font-size="9.5" class="ink">여기서 그 실을 끊는다.</text>
  <text x="820" y="234" text-anchor="middle" font-size="11" font-weight="700" class="t">편다.</text>
  <text x="820" y="252" text-anchor="middle" font-size="8.5" class="gy">끊어지는 소리가 아니라, 묶여 있던 것이</text>
  <text x="820" y="265" text-anchor="middle" font-size="8.5" class="gy">제 길이로 돌아가는 소리다</text>
  <line x1="744" y1="278" x2="896" y2="278" stroke="#8A6A12" stroke-width="0.6" opacity="0.4"/>
  <text x="820" y="296" text-anchor="middle" font-size="8.5" class="gy">5장에서 다섯 방을 건너왔다</text>

  <!-- 꼬리 — 짝과 한 글자만 다르다 -->
  <line x1="44" y1="384" x2="916" y2="384" stroke="#8A6A12" stroke-width="0.8" opacity="0.4"/>
  <text x="480" y="408" text-anchor="middle" font-size="15" font-weight="700" class="ink">손가락을 편다. 같이 <tspan class="a">세</tspan> 세.</text>
  <text x="480" y="428" text-anchor="middle" font-size="9" class="gy">→ 1장 이월 · <tspan font-style="italic">"마지막 문을 열면, 뜻밖에도 첫 방이다"</tspan></text>
</svg>
