  <text x="415.7" y="266" font-size="11" class="gd">못 넷 — 끝에서 쓸 물건</text>
  <text x="94" y="357" text-anchor="end" font-size="11.5" class="gy">전</text>
  <rect x="104" y="343" width="380.2" height="18" rx="3" fill="#cfc7b6" stroke="#b9b1a2" stroke-width="1.4"/>
  <text x="493.2" y="357" font-size="12" font-weight="700" class="t">208단락</text>
