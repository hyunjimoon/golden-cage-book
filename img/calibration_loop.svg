  <text x="892" y="408" text-anchor="end" font-size="11" class="gy">아래 = 내가 내 원고를 센 값 · 위 = 밖에서 와야 하는 값</text>
  <line x1="104" y1="398" x2="892" y2="398" stroke="#b9b1a2" stroke-width="1"/>
  <text x="480" y="418" text-anchor="middle" font-size="12.5" class="t">아래 선엔 눈금과 점이 있고, 위로 돌아오는 호는 비어 있다.</text>
