<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>
    text { font-family: 'Noto Sans KR','Apple SD Gothic Neo',sans-serif; }
    .t{fill:#2b2620} .gy{fill:#6a6355} .gd{fill:#8a6a12}
  </style>
  <rect width="960" height="440" fill="#F3EEE3"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" class="t">앞에 놓은 것은 셌다. 되받은 것은 없다.</text>
  <text x="480" y="55" text-anchor="middle" font-size="11" class="gy" letter-spacing="1">calibration = 앞에 놓은 물건으로 읽는 사람이 끝을 뒤집는지 재서, 어긋난 만큼 앞을 고치는 고리</text>
  <path d="M 892 268 C 720 120, 300 120, 118 262" fill="none" stroke="#b9b1a2" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M 118 262 l 11 -12 l -1 16 z" fill="#b9b1a2"/>
  <rect x="356" y="128" width="248" height="46" rx="8" fill="#F3EEE3" stroke="#b9b1a2" stroke-width="1.4" stroke-dasharray="5 5"/>
  <text x="480" y="148" text-anchor="middle" font-size="12.5" class="gy">읽은 사람이 되받아 준 값</text>
  <text x="480" y="166" text-anchor="middle" font-size="14" font-weight="700" class="gy">0건</text>
  <text x="892" y="250" text-anchor="end" font-size="11" class="gy">끝을 읽고 돌아와야 하는 선</text>
  <line x1="104" y1="300" x2="892" y2="300" stroke="#2b2620" stroke-width="2"/>
