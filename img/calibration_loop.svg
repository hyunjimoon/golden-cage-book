  <rect width="960" height="440" fill="#F3EEE3"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" class="t">앞에 놓은 것은 셌다. 아직 아무에게도 안 줬다.</text>
  <text x="480" y="55" text-anchor="middle" font-size="11" class="gy" letter-spacing="1">calibration = 앞에 놓은 물건으로 읽는 사람이 끝을 뒤집는지 재서, 어긋난 만큼 앞을 고치는 고리</text>
  <text x="104" y="104" font-size="12.5" font-weight="700" class="t">끊긴 데는 돌아오는 선이 아니라 내보내는 문이다</text>
