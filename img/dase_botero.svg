<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880">
  <style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif}</style>
  <rect width="1180" height="880" fill="#F3EEE3"/>
  <text x="590" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#2b2620">양식은 탁월함에 대한 질문이다 — 다와 세는 그 질문을 계속 묻는가</text>
  <text x="590" y="58" text-anchor="middle" font-size="11.5" fill="#6a6355">「양식(style)이란 회화의 탁월함에 대한 성찰」 — 보테로 · 잰 것 = 4차소통 원고 1~10장 대사 230줄 (2026-11-10)</text>
  <rect x="56" y="78" width="528" height="72" rx="8" fill="#ffffff" fill-opacity="0.6" stroke="#A8431E" stroke-width="1.4"/>
  <text x="74" y="106" font-size="22" font-weight="700" fill="#A8431E">다</text>
  <text x="102" y="105" font-size="12.5" font-weight="700" fill="#2b2620">값을 다 보면서도 거는 삶 — 눈이 아니라 발로 산 날만 센다.</text>
  <text x="102" y="128" font-size="10.5" fill="#6a6355">양식 = 단문 · 동사 맨 앞 · 선언으로 닫는다</text>
  <text x="102" y="143" font-size="10" fill="#A8431E">그가 탁월하다고 여기는 것은 말이 아니라 <tspan font-weight="700">이 모양</tspan>에 적혀 있다</text>
  <rect x="596" y="78" width="528" height="72" rx="8" fill="#ffffff" fill-opacity="0.6" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="614" y="106" font-size="22" font-weight="700" fill="#1F4E79">세</text>
  <text x="642" y="105" font-size="12.5" font-weight="700" fill="#2b2620">결과가 오면 고치는 삶 — 확신이 검증을 앞지르지 않게 매일 장부를 편다.</text>
  <text x="642" y="128" font-size="10.5" fill="#6a6355">양식 = 복문 · 조건절 · 끝내 안 닫는다</text>
  <text x="642" y="143" font-size="10" fill="#1F4E79">그가 탁월하다고 여기는 것은 말이 아니라 <tspan font-weight="700">이 모양</tspan>에 적혀 있다</text>
  <text x="56" y="188" font-size="12.5" font-weight="700" fill="#2b2620">① 입 — 제 이름으로 말한 줄 수</text>
  <text x="56" y="205" font-size="10.5" fill="#6a6355">1~4장은 두 입이 따로 선다. 5장은 장면이라 대사가 없고, 6장부터 한 입(세다)으로 합쳐진다.</text>
  <line x1="70" y1="356" x2="1140" y2="356" stroke="#2b2620" stroke-width="1.4"/>
  <line x1="70" y1="316" x2="1140" y2="316" stroke="#b9b1a2" stroke-width="0.7" opacity="0.6"/>
  <text x="64" y="320" text-anchor="end" font-size="9.5" fill="#9c968b">10</text>
  <line x1="70" y1="276" x2="1140" y2="276" stroke="#b9b1a2" stroke-width="0.7" opacity="0.6"/>
  <text x="64" y="280" text-anchor="end" font-size="9.5" fill="#9c968b">20</text>
  <line x1="70" y1="236" x2="1140" y2="236" stroke="#b9b1a2" stroke-width="0.7" opacity="0.6"/>
  <text x="64" y="240" text-anchor="end" font-size="9.5" fill="#9c968b">30</text>
  <rect x="72" y="300" width="18" height="56" fill="#A8431E" opacity="0.88"/>
  <text x="81" y="295" text-anchor="middle" font-size="9.5" font-weight="700" fill="#A8431E">14</text>
  <rect x="95" y="300" width="18" height="56" fill="#1F4E79" opacity="0.88"/>
  <text x="104" y="295" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F4E79">14</text>
  <text x="104" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🪞</text>
  <text x="104" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">1</text>
  <rect x="182" y="228" width="18" height="128" fill="#A8431E" opacity="0.88"/>
  <text x="191" y="223" text-anchor="middle" font-size="9.5" font-weight="700" fill="#A8431E">32</text>
  <rect x="205" y="244" width="18" height="112" fill="#1F4E79" opacity="0.88"/>
  <text x="214" y="239" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F4E79">28</text>
  <text x="214" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🔭</text>
  <text x="214" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">2</text>
  <rect x="292" y="236" width="18" height="120" fill="#A8431E" opacity="0.88"/>
  <text x="301" y="231" text-anchor="middle" font-size="9.5" font-weight="700" fill="#A8431E">30</text>
  <rect x="315" y="252" width="18" height="104" fill="#1F4E79" opacity="0.88"/>
  <text x="324" y="247" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F4E79">26</text>
  <text x="324" y="375" text-anchor="middle" font-size="12" fill="#6a6355">💒</text>
  <text x="324" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">3</text>
  <rect x="402" y="220" width="18" height="136" fill="#A8431E" opacity="0.88"/>
  <text x="411" y="215" text-anchor="middle" font-size="9.5" font-weight="700" fill="#A8431E">34</text>
  <rect x="425" y="256" width="18" height="100" fill="#1F4E79" opacity="0.88"/>
  <text x="434" y="251" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F4E79">25</text>
  <text x="434" y="375" text-anchor="middle" font-size="12" fill="#6a6355">⏱️</text>
  <text x="434" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">4</text>
  <text x="544" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🐀</text>
  <text x="544" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">5</text>
  <rect x="622" y="348" width="18" height="8" fill="#A8431E" opacity="0.88"/>
  <text x="631" y="343" text-anchor="middle" font-size="9.5" font-weight="700" fill="#A8431E">2</text>
  <rect x="668" y="312" width="18" height="44" fill="#B8860B" opacity="0.88"/>
  <text x="677" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B8860B">11</text>
  <text x="654" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🦋</text>
  <text x="654" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">6</text>
  <rect x="778" y="340" width="18" height="16" fill="#B8860B" opacity="0.88"/>
  <text x="787" y="335" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B8860B">4</text>
  <text x="764" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🧅</text>
  <text x="764" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">7</text>
  <rect x="888" y="336" width="18" height="20" fill="#B8860B" opacity="0.88"/>
  <text x="897" y="331" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B8860B">5</text>
  <text x="874" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🌫️</text>
  <text x="874" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">8</text>
  <rect x="998" y="328" width="18" height="28" fill="#B8860B" opacity="0.88"/>
  <text x="1007" y="323" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B8860B">7</text>
  <text x="984" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🐦‍⬛</text>
  <text x="984" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">9</text>
  <text x="1094" y="375" text-anchor="middle" font-size="12" fill="#6a6355">🧫</text>
  <text x="1094" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2620">10</text>
  <rect x="900" y="196" width="12" height="12" fill="#A8431E"/>
  <text x="918" y="206" font-size="11" font-weight="700" fill="#A8431E">다</text>
  <rect x="978" y="196" width="12" height="12" fill="#1F4E79"/>
  <text x="996" y="206" font-size="11" font-weight="700" fill="#1F4E79">세</text>
  <rect x="1056" y="196" width="12" height="12" fill="#B8860B"/>
  <text x="1074" y="206" font-size="11" font-weight="700" fill="#B8860B">세다</text>
  <text x="544" y="344" text-anchor="middle" font-size="9.5" fill="#b03a2e">장면 — 대사 0</text>
  <text x="1094" y="344" text-anchor="middle" font-size="9.5" fill="#b03a2e">본문 0</text>
  <text x="56" y="432" font-size="12.5" font-weight="700" fill="#2b2620">② 드러냄 — 스스로 값을 치르고 선호를 노출한 자리 (말이 아니라 대가)</text>
  <text x="56" y="450" font-size="10.5" fill="#6a6355">말한 선호(stated)는 공짜다. 평판·자원·몸을 내고 드러난 선호(revealed)만 센다.</text>
  <line x1="70" y1="496" x2="1140" y2="496" stroke="#b9b1a2" stroke-width="1"/>
  <text x="62" y="501" text-anchor="end" font-size="14" font-weight="700" fill="#A8431E">다</text>
  <circle cx="214" cy="496" r="7.5" fill="#A8431E"/>
  <text x="214" y="482" text-anchor="middle" font-size="9.5" fill="#A8431E">자기 진단을 꺼냄</text>
  <circle cx="324" cy="496" r="7.5" fill="#A8431E"/>
  <text x="324" y="482" text-anchor="middle" font-size="9.5" fill="#A8431E">2018년 자백</text>
  <circle cx="434" cy="496" r="7.5" fill="#A8431E"/>
  <text x="434" y="482" text-anchor="middle" font-size="9.5" fill="#A8431E">시계·3년 기획·대화 리듬</text>
  <circle cx="544" cy="496" r="7.5" fill="#A8431E"/>
  <text x="544" y="482" text-anchor="middle" font-size="9.5" fill="#A8431E">쏘고 한 눈을 잃음</text>
  <circle cx="1094" cy="496" r="7.5" fill="none" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="70" y1="566" x2="1140" y2="566" stroke="#b9b1a2" stroke-width="1"/>
  <text x="62" y="571" text-anchor="end" font-size="14" font-weight="700" fill="#1F4E79">세</text>
  <circle cx="324" cy="566" r="7.5" fill="#1F4E79"/>
  <text x="324" y="586" text-anchor="middle" font-size="9.5" fill="#1F4E79">5초 침묵</text>
  <circle cx="434" cy="566" r="7.5" fill="#1F4E79"/>
  <text x="434" y="586" text-anchor="middle" font-size="9.5" fill="#1F4E79">「그럼 태워야죠」</text>
  <circle cx="654" cy="566" r="7.5" fill="#1F4E79"/>
  <text x="654" y="586" text-anchor="middle" font-size="9.5" fill="#1F4E79">짐작이 틀렸다</text>
  <circle cx="764" cy="566" r="7.5" fill="#1F4E79"/>
  <text x="764" y="586" text-anchor="middle" font-size="9.5" fill="#1F4E79">〃</text>
  <circle cx="874" cy="566" r="7.5" fill="#1F4E79"/>
  <text x="874" y="586" text-anchor="middle" font-size="9.5" fill="#1F4E79">〃</text>
  <circle cx="984" cy="566" r="7.5" fill="#1F4E79"/>
  <text x="984" y="586" text-anchor="middle" font-size="9.5" fill="#1F4E79">〃</text>
  <circle cx="1094" cy="566" r="7.5" fill="none" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="1076" y="533" text-anchor="end" font-size="10.5" font-weight="700" fill="#b03a2e">10장 — 둘 다 0</text>
  <text x="1076" y="548" text-anchor="end" font-size="9.5" fill="#6a6355">「나에게 하세요. 다 말고, 나에게」는 설계 메모에만 있다</text>
  <line x1="544" y1="466" x2="544" y2="596" stroke="#9c968b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="554" y="610" font-size="9.5" fill="#6a6355">5장 — 다는 쏘고, 세는 쏘인다(선택 아님)</text>
  <rect x="56" y="648" width="1084" height="186" rx="10" fill="#ffffff" fill-opacity="0.62" stroke="#b9b1a2" stroke-width="1"/>
  <text x="76" y="674" font-size="13.5" font-weight="700" fill="#2b2620">보테로 시험 — 양식이 탁월함을 계속 묻는가</text>
  <text x="78" y="704" font-size="13">✅</text>
  <text x="104" y="704" font-size="12" font-weight="700" fill="#1F4E79">세 — 통과.</text>
  <text x="192" y="704" font-size="11" fill="#6a6355">6~9장에서 「제 짐작이 반쯤 틀렸어요」를 네 장 연속 적는다. 유보·되물음이라는 양식 자체가 질문을 계속 거는 장치다.</text>
  <text x="78" y="737" font-size="13">⬜</text>
  <text x="104" y="737" font-size="12" font-weight="700" fill="#A8431E">다 — 판정 불가.</text>
  <text x="230" y="737" font-size="11" fill="#6a6355">5장에서 한 눈을 잃고 6장에 두 줄 말한 뒤 입이 0이 된다. 묻기를 그만둔 게 아니라 물을 자리가 없다.</text>
  <text x="78" y="770" font-size="13">🚨</text>
  <text x="104" y="770" font-size="12" font-weight="700" fill="#b03a2e">합쳐진 것은 내용뿐이다.</text>
  <text x="268" y="770" font-size="11" fill="#6a6355">「벗을 수 있는 것 안에서 고른다」(6장)·「반쯤 열렸을 때가 가장 넓다」(8장)는 다의 옵션 논리인데, 말하는 양식은 전부 세의 것이다.</text>
  <text x="78" y="803" font-size="13">⚓</text>
  <text x="104" y="803" font-size="12" font-weight="700" fill="#2b2620">두 판정이 한 칸에 걸려 있다 — 10장.</text>
  <text x="394" y="803" font-size="11" fill="#6a6355">「나에게 하세요. 다 말고, 나에게」는 단문·명령형, 곧 다의 양식이다. 지금 설계 메모에만 있고 본문 착지 0건.</text>
  <text x="56" y="866" font-size="10" fill="#6a6355">양식이 탁월함의 질문이라면, 내용만 합쳐진 합은 두 질문의 합이 아니라 <tspan font-weight="700" fill="#2b2620">한 질문의 승리</tspan>다.</text>
  <text x="1140" y="866" text-anchor="end" font-size="10" fill="#6a6355">5장 거울 — 「세」 절은 어미가 ~다로, 「다」 절은 ~세로 닫힌다</text>
</svg>
